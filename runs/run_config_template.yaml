run_name: main
date: "YYYY-MM-DD"
study: main                 # main | time_budget | token_budget | multiturn
models: [phi4, gemma3-27b, deepseek-r1-14b, qwen3-14b, gpt-oss-20b]  # ids from registry
families: all               # 'all' or list like ["01","02"]
criteria: all               # 'all' or subset of [1,2,3]
samples_per_problem: 1      # pass@1 => 1; raise for pass@k later
seed: 0
generation:
  temperature: 0.2
  # token_budget per-model comes from registry; can be overridden here
evaluation:
  # Audit B1: the per-task time_limit_s in each meta.yaml is authoritative. This global
  # value can only TIGHTEN it, never expand it (the checker takes min(declared, global)).
  # Leave null to use each task's declared limit. Do NOT set this above a task limit
  # expecting more time -- it will be ignored, by design.
  global_timeout_s: null    # null = enforce each problem's declared limit
