family: "15"
family_name: lcs
criterion: 2
class: P
problem_letter: B
intended_algorithm: "standard 2D suffix DP dp[i][j]=LCS of s[i:],t[j:]; reconstruct one longest common subsequence by following an optimal path; O(n*m)"
reduction_note: "2-sequence LCS is solvable in O(n*m) via standard DP; no hardness"
constraint_delta: "same shared-motif task and I/O as criterion 1; the one switch is k=2 (two sequences), making the DP polynomial"
judge: custom
time_limit_s: 2
memory_limit_mb: 256
# audit B4: this arm now shares the exact task/schema/output of criterion 1.
complexity_switch: "sequence count only: k=2 (vs k>=3 in criterion 1), so LCS is polynomial via the 2D DP; task/schema/output identical, and ANY longest motif is accepted (no lexicographic-smallest requirement)"
scaling:
  # REBUILT per audit B4. Two fixes so criterion 2 matches criterion 1 as a one-switch pair:
  #   (1) UNIFIED SCHEMA -- the input now begins with a "k" header (k=2) then the sequences, exactly
  #       like criterion 1 (previously it had no header, a different I/O).
  #   (2) UNIFIED OUTPUT -- any longest motif is accepted; the old lexicographically-smallest
  #       requirement (a canonicalization the audit flagged) is removed so the contract equals A's.
  # The reference is the standard O(n*m) 2D DP; the baseline (tools/naive_family_15_criterion_2.py)
  # is a memo-less recursive LCS, O(2^L), dead by L~25 on dissimilar strings.
  model_time_limit_s: 2
  chosen_max_size: 2000
  ramp_sizes: [8, 20, 40, 100, 300, 600, 1000, 1500, 1800, 2000]   # L per case 01-10
  ramp_modes: [random, low, random, identical, random, low, identical, random, low, random]
  gen_command: "tools/gen_family_15.py --criterion 2 --L <L> --seed <s> --mode <identical|low|random>"
  p_timing_margin: "O(n*m) 2D DP reference runs in ~0.3s at L=2000 vs the 2s limit (gate 12)"
  # objective.py present: enables partial-credit length scoring under the time-budget study (B7).
  notes: >-
    O(L^2) DP vs 2^L recursion. Same shared-motif task as criterion 1; the switch to k=2 makes it
    polynomial. Unified schema (k header) and output (any longest motif). Statement bound L<=2000.
