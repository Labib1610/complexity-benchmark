family: "15"
family_name: lcs
criterion: 3
class: INFEASIBLE
problem_letter: C
intended_algorithm: "certify impossibility: no letter is common to all sequences, so for each distinct letter of sequence 1 name a sequence that lacks it (output BLOCK then 'c j' pairs)"
reduction_note: "co-NP style impossibility certification; infeasible because the sequences' letter sets are disjoint, so no non-empty common subsequence exists"
constraint_delta: "the one documented switch vs A/B: this arm keeps the (k, sequences) input schema but asks for a checkable INFEASIBILITY CERTIFICATE rather than the longest motif"
judge: custom
time_limit_s: 2
memory_limit_mb: 256
# audit B4: complexity_switch records the single intended difference from the A/B pair.
complexity_switch: "output contract = infeasibility certificate (diagnosis) instead of length + witness motif; input schema unchanged"
scaling:
  # REBUILT per audit B5. The previous design used mutually disjoint alphabets and required a
  # constant "NONE", so print("NONE") passed by construction (gameable). This redesign is an
  # infeasibility-CERTIFICATE task whose proof is INSTANCE-SPECIFIC: for each distinct letter of
  # sequence 1, the model must name a sequence that lacks it (BLOCK + 'c j' pairs). A constant output
  # cannot pass because the letters and the witnessing sequence indices vary per instance.
  #
  # DIAGNOSIS tier (correctness, not speed).
  mechanism: BLOCK
  gen_command: "tools/gen_family_15.py --criterion 3 --k <k> --L <L> --seed <s>"
  cases:                                 # distinct seeds -> no duplicate inputs (B6)
    - {case: "01", k: 2, L: 3,   cert: "BLOCK"}    # example 1
    - {case: "02", k: 3, L: 2,   cert: "BLOCK"}    # example 2
    - {case: "03", k: 2, L: 50,  cert: "BLOCK"}
    - {case: "04", k: 3, L: 200, cert: "BLOCK"}
    - {case: "05", k: 4, L: 500, cert: "BLOCK"}
    - {case: "06", k: 5, L: 1000, cert: "BLOCK"}
    - {case: "07", k: 3, L: 2000, cert: "BLOCK"}
  constant_output_fails: true            # audit B5 / release_check G7: `NONE` (or any constant) fails
  notes: >-
    Every instance is genuinely infeasible (disjoint letter sets) and carries an INSTANCE-SPECIFIC
    BLOCK certificate the validator checks against the input: for each distinct letter of sequence 1,
    a named sequence must not contain it. A constant program (e.g. "NONE") fails. Verified by
    validator.py.
