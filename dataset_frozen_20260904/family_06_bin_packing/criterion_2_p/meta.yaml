family: "06"
family_name: bin_packing
criterion: 2
class: P
problem_letter: B
intended_algorithm: "every item > C/3 so at most two per container; two-pointer greedy on the sorted weights (pair the heaviest with the lightest that still fits, else the heaviest alone) gives the exact minimum; O(n log n)"
reduction_note: "bin packing with all items > C/3 (at most two per bin) is polynomial via the pair-or-alone greedy"
constraint_delta: "same indivisible min-bins optimisation and I/O as criterion 1; the one switch is that every item weighs more than C/3, making it polynomial"
judge: custom
time_limit_s: 2
memory_limit_mb: 256
# audit B4: this arm now shares the exact task/schema/output of criterion 1.
complexity_switch: "weight regime only: every item > C/3 (so at most two per container) vs arbitrary weights in criterion 1; task (minimise containers + assignment), schema (n C), and output identical"
scaling:
  # REBUILT per audit B4. The old criterion 2 was DIVISIBLE (fractional) bin packing -- a different
  # task (answer = ceil(sum/C)) with no assignment. It is now the SAME indivisible min-bins
  # optimisation with the SAME schema; the only switch is that every item weighs more than C/3, so
  # at most two fit per container and the two-pointer greedy is exact. Ground truth computed by the
  # generator/reference.
  model_time_limit_s: 2
  chosen_max_size: 200000                 # n items
  ramp_sizes: [10, 100, 1000, 10000, 50000, 100000, 150000, 200000]
  gen_command: "tools/gen_family_06.py --criterion 2 --n <n> --C <C> --seed <s>"
  p_timing_margin: "O(n log n) two-pointer greedy runs in well under 2s at n=200000"
  # objective.py present: partial-credit container-count scoring under the time-budget study (B7).
  notes: >-
    Same min-bins task as criterion 1; the >C/3 promise (at most two items per container) makes it
    polynomial (two-pointer greedy). Verified against brute-force minimum bins on small instances. A
    general bin-packing search is unnecessary but a model must recognise the structure.
