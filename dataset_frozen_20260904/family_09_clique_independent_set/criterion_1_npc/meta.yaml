family: "09"
family_name: clique_independent_set
criterion: 1
class: NPC
problem_letter: A
intended_algorithm: "independent set of size k == clique of size k in the complement; bitset branch-and-bound on the complement graph (maintain clique R, candidate set P, prune when |R|+|P|<k)"
reduction_note: "INDEPENDENT SET; NP-complete; Karp (1972); dual of CLIQUE via graph complement"
constraint_delta: "general graph (NP-complete base)"
judge: custom
time_limit_s: 5
memory_limit_mb: 256
scaling:
  # REBUILT per audit B4/B6. The family is UNIFIED on INDEPENDENT SET (decide a size-k independent
  # set + witness) with one schema; the A/B switch is now the graph class (general vs bipartite).
  # Reference: independent set == clique in the complement, solved by bitset branch-and-bound.
  # Baseline (tools/naive_family_09_criterion_1.py): checks all C(n,k) subsets -> TLE at large n.
  model_time_limit_s: 5
  # Ground truth (max IS) is computed by the generator via B&B on the complement, so k is always
  # correct: NO cases use a dense graph with k = maxIS+1; YES cases plant an independent set on the
  # highest-indexed vertices (found last by the C(n,k) baseline) with k = the true max IS.
  chosen_max_size: 46                     # complement B&B stays ~0.01s (heavy pruning)
  ramp_sizes: [26, 30, 34, 40, 46]        # n per case 06-10
  ramp_kind:  [no, yes, no, yes, no]
  gen_command: "tools/gen_family_09.py --criterion 1 --n <n> --seed <s> --kind <yes|no>"
  honest_limitation: >-
    Inherent gradeable-NPC ceiling (see family_04 REBUILD_NOTES): the branch-and-bound reference
    (a competent exact solver) solves every case in ~0.01s. The tier separates the C(n,k) subset
    baseline from B&B -- it does NOT prove hardness against a competent solver, and must not be
    reported as such.
  notes: >-
    Bitset B&B on the complement vs C(n,k) subset enumeration. Hard-YES plants an independent set on
    the highest-indexed vertices (found last by the baseline -> TLE) so the tier is non-gameable even
    vs a timeout-fallback-to-NO heuristic. Verified against brute force on small graphs.
