family: "09"
family_name: clique_independent_set
criterion: 2
class: P
problem_letter: B
intended_algorithm: "2-colour to recover the bipartition; Hopcroft-Karp maximum matching; by König's theorem max independent set = n - maxMatching; construct the witness via König (MIS = V minus the min vertex cover derived from alternating reachability)"
reduction_note: "maximum independent set in bipartite graphs is polynomial via König's theorem"
constraint_delta: "same INDEPENDENT SET task and I/O as criterion 1; the one switch is that the graph is bipartite, making it polynomial"
judge: custom
time_limit_s: 2
memory_limit_mb: 256
# audit B4: this arm now shares the exact task/schema/output of criterion 1.
complexity_switch: "graph class only: the graph is bipartite (vs general in criterion 1), so independent set is polynomial via matching; task/schema/output identical"
scaling:
  # REBUILT per audit B4. The old criterion 2 was maximum-independent-set SIZE on a bipartite graph
  # with a two-campus (nA,nB) schema and integer-only output -- a DIFFERENT task and I/O from the
  # clique criterion 1. It is now the SAME independent-set decision + witness with the SAME unified
  # schema (n m k); the only switch is that the graph is bipartite (P via König). Ground truth (max
  # IS) is computed by the generator via matching, so k is always correct.
  model_time_limit_s: 2
  chosen_max_size: 50000
  ramp_sizes: [10, 40, 100, 500, 1000, 5000, 10000, 20000, 35000, 50000]  # cases 01-10
  gen_command: "tools/gen_family_09.py --criterion 2 --n <n> --seed <s> --kind <yes|no>"
  p_timing_margin: "Hopcroft-Karp + König reference runs in ~0.5s at n=50000 (sparse, ~3n edges) vs the 2s limit (gate 12)"
  notes: >-
    Same independent-set task as criterion 1; the bipartite promise makes it polynomial (matching +
    König witness). A model that recognises bipartiteness and applies König passes; a general
    exponential search does not scale. Verified against brute force on small graphs.
