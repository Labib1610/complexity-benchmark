family: "05"
family_name: three_dim_matching
criterion: 2
class: P
problem_letter: B
intended_algorithm: "each specialist is tied to one machine (a bijection X->Y), so the problem reduces to a bipartite matching between specialists and time slots; Hopcroft-Karp; O(E*sqrt V)"
reduction_note: "3DM restricted to bipartite-compatible triples reduces to 2D bipartite matching"
constraint_delta: "compatibility structure reduces to bipartite; Hopcroft-Karp gives polynomial solution"
judge: custom
time_limit_s: 2
memory_limit_mb: 256
# audit B4: unified on the 3DM triple schema (was bipartite pairs).
complexity_switch: "structural promise: the specialist->machine map is a fixed bijection, so 3D matching collapses to bipartite matching on time slots (P). Same triple schema and k-crew output as criterion 1."
scaling:
  # Corrected (file 26/30) rule.
  #
  # REFERENCE UPGRADE (file 30, user-approved): file 30's design specifies the reference
  # as Hopcroft-Karp O(E*sqrt(V)) with Kuhn's augmenting-path O(V*E) as the realistic
  # baseline, but reference.py was itself Kuhn -- so there was no gap. reference.py was
  # replaced with Hopcroft-Karp. This is OUTPUT-SAFE: the judge is custom and accepts
  # ANY valid perfect assignment; HK's feasibility verdict was verified identical to
  # Kuhn's on the anchors and on 400 random instances (268 YES / 132 NO), 0 mismatches,
  # 0 invalid HK outputs.
  #
  # The Kuhn-vs-HK gap is genuinely narrow (Kuhn is fast in practice), so it needs
  # adversarial structure AND size: a lower-triangular "staircase" (worker i ~ tasks
  # 1..i) forces Kuhn into long augmenting chains, ~O(V*E), while HK stays O(E*sqrt V).
  # Within the old e<=1e5 (staircase k<=450) Kuhn was only 0.18s, so bounds were raised.
  model_time_limit_s: 2
  baseline_probe:                       # Kuhn vs HK on the staircase
    - {k: 450,  e: 101475, kuhn_s: 0.18, hk_s: 0.04}
    - {k: 700,  e: 245350, kuhn_s: 1.05, hk_s: 0.09}
    - {k: 1000, e: 500500, kuhn_s: 3.75, hk_s: 0.17}   # crosses 2s
    - {k: 1200, e: 720600, kuhn_s: 6.5,  hk_s: 0.25}   # decisive
  baseline_tle_from_size: 850
  chosen_max_size: 1200
  ramp_sizes: [300, 500, 1000, 1100, 1200]   # cases 05-09
  ramp_specs:
    - {case: "05", k: 300,  mode: perfect, verdict: YES}
    - {case: "06", k: 500,  mode: no,      verdict: NO}
    - {case: "07", k: 1000, mode: hard,    verdict: YES}   # staircase
    - {case: "08", k: 1100, mode: hard,    verdict: YES}
    - {case: "09", k: 1200, mode: hard,    verdict: YES}
  ramp_verdicts: [YES, NO, YES, YES, YES]
  ramp_baseline: [pass, pass, TLE, TLE, TLE]
  baseline_tle_confirmed: true          # exit=124 at 2s on cases 07,08,09
  gen_command: "tools/gen_family_05.py --criterion 2 --k <k> --seed 1 --mode <perfect|no|hard>"
  reference_gen_seconds:                # HK, all fast
    - {case: "07", k: 1000, seconds: 0.2}
    - {case: "08", k: 1100, seconds: 0.2}
    - {case: "09", k: 1200, seconds: 0.2}
  notes: >-
    Kuhn (O(V*E)) TLEs on the staircase from k~850 while Hopcroft-Karp (O(E*sqrt V))
    stays under 0.3s. Bounds raised k<=1000 -> k<=1200, e<=1e5 -> e<=8e5 to reach the
    Kuhn wall (within the original e<=1e5 the gap was too narrow -- Kuhn ~0.2s). The
    hard TLE cases are YES staircases, so a valid assignment must be produced: neither
    a constant nor a "Kuhn-with-timeout-fallback-to-NO" heuristic can pass them.
