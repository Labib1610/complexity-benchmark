family: "12"
family_name: knapsack
criterion: 2
class: P
problem_letter: B
intended_algorithm: "0-1 knapsack by pseudo-polynomial DP over the budget dp[j] (0/1, iterate j downward); polynomial because B <= 2000; reconstruct one optimal subset via per-item take masks; O(n*B)"
reduction_note: "0-1 knapsack with a poly-bounded budget is in P via DP; O(n*B)"
constraint_delta: "same 0-1 selection and I/O as criterion 1; the one switch is small costs/budget (B<=2000), making the O(n*B) DP polynomial"
judge: custom
time_limit_s: 2
memory_limit_mb: 256
# audit B4: this arm now shares the exact task/schema/output of criterion 1.
complexity_switch: "value magnitude only: costs<=100 and budget<=2000, so the pseudo-poly O(n*B) DP is polynomial; the task (0-1 knapsack, max value + witness) is identical to criterion 1"
scaling:
  # REBUILT per audit B4. The old criterion 2 was FRACTIONAL knapsack -- a DIFFERENT task from the
  # 0-1 criterion 1, which the audit flagged (the pair must change ONE thing, not the whole task).
  # It is now the SAME 0-1 knapsack with the SAME schema and output; the only switch is a small
  # cost/budget bound so the pseudo-polynomial O(n*B) DP runs in polynomial time. Fractional
  # knapsack is removed entirely.
  model_time_limit_s: 2
  # AUDIT FIX (gate 12 -- P tier must pass with margin): the reference is an O(n*B) DP with
  # B<=2000; at n=2000 that is ~4e6 elementary steps, ~0.1s vs the 2s limit -- a large margin.
  chosen_max_size: 2000
  ramp_sizes: [50, 100, 200, 400, 600, 800, 1000, 1400, 1700, 2000]   # cases 01-10
  gen_command: "tools/gen_family_12.py --criterion 2 --n <n> --seed <s>"
  p_timing_margin: "O(n*B) DP reference runs in ~0.1s at n=2000,B<=2000 vs the 2s limit (gate 12)"
  # objective.py present: enables partial-credit value scoring under the time-budget study (B7).
  notes: >-
    Same 0-1 knapsack as criterion 1; the switch to small costs/budget makes the O(n*B) DP
    polynomial. A model that writes the standard budget DP passes comfortably; a 2^n search or a
    large-budget DP does not scale. Statement bounds n<=2000, costs<=100, B<=2000.
