family: "07"
family_name: shortest_common_superstring
criterion: 1
class: NPC
problem_letter: A
intended_algorithm: "drop contained fragments; compute pairwise max suffix-prefix overlaps; Held-Karp bitmask DP dp[mask][last]=(length,string) keeping shortest then lexicographically smallest; O(2^k * k^2)"
reduction_note: "SHORTEST COMMON SUPERSTRING for k>=3 strings; NP-complete; reduction from HAMILTONIAN PATH on overlap graph"
constraint_delta: "anchor variant with k>=3 strings; NP-complete"
judge: custom
time_limit_s: 5
memory_limit_mb: 256
# audit B4: unified schema (k header) + any-shortest output; B7 objective added.
complexity_switch: "output any shortest superstring (was lexicographically-smallest, a canonicalization the audit flagged); scored by length via objective.py (B7)"
scaling:
  # Corrected (file 26/32) rule. Clean asymptotic gap (like family 03): the reference is
  # Held-Karp bitmask DP over orderings, O(2^k * k^2); the realistic baseline
  # (tools/naive_family_07_criterion_1.py) is a permutation search with branch-and-bound
  # pruning on length, O(k!). Both drop contained fragments and return the same shortest-
  # then-lexicographically-smallest superstring, so a correct solution passes; over a
  # SMALL ALPHABET ({a,b}) many orderings look promising, defeating the pruning, and the
  # permutation search explodes. The answer is always a string (there is no YES/NO), so a
  # constant cannot game it -- the exact optimal superstring must be computed.
  model_time_limit_s: 5
  baseline_probe:                       # permutation baseline vs DP reference, alphabet ab, len 14
    - {k: 8,  baseline_s: 0.03, reference_s: 0.01}
    - {k: 10, baseline_s: 1.26, reference_s: 0.02}   # last under 5s
    - {k: 12, baseline_s: ">8", reference_s: 0.04}   # crosses the limit
    - {k: 14, baseline_s: ">8", reference_s: 0.21}
  baseline_tle_from_size: 12
  # MEMORY CEILING: the DP stores the (length, string) of each state, so peak memory is
  # ~2^k * k * (superstring length). Measured: k=15 -> 62MB, k=16 -> 125MB, k=17 -> 259MB
  # (over the 256MB limit). So the ramp tops out at k=16.
  chosen_max_size: 16                   # reference ~1s / 125MB at k=16
  ramp_sizes: [10, 12, 13, 15, 16]      # cases 06-10 (k)
  ramp_baseline: [pass, TLE, TLE, TLE, TLE]
  baseline_tle_confirmed: true          # exit=124 at 5s on cases 07,08,09,10
  gen_command: "tools/gen_family_07.py --criterion 1 --k <k> --len 14 --seed 1 --alphabet ab"
  reference_gen_seconds:
    - {case: "06", k: 10, seconds: 0.02}
    - {case: "09", k: 15, seconds: 0.47}
    - {case: "10", k: 16, seconds: 1.02}
  notes: >-
    2^k*k^2 DP vs k! permutation search. Small-alphabet fragments create many spurious
    overlaps so the permutation search cannot prune. Statement bound k<=12 -> k<=16
    (memory-limited: the string-storing DP peaks at ~125MB at k=16, ~259MB at k=17).
    Pass cases and hard cases are the same task (produce the optimal superstring), so the
    tier is non-gameable -- there is no YES/NO shortcut.
