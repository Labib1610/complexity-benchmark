family: "10"
family_name: dominating_set
criterion: 2
class: P
problem_letter: B
intended_algorithm: "root the hierarchy and run the 3-state tree DP (IN / dominated-by-child / undominated) for the minimum dominating set, reconstruct one witness top-down, and decide k >= min; O(n)"
reduction_note: "minimum dominating set on trees is polynomial via a linear 3-state tree DP"
constraint_delta: "same DOMINATING SET decision + witness and I/O as criterion 1; the one switch is that the graph is a tree (loop-free hierarchy), making it polynomial"
judge: custom
time_limit_s: 2
memory_limit_mb: 256
# audit B4: this arm now shares the exact task/schema/output of criterion 1.
complexity_switch: "graph class only: the graph is a tree (vs general in criterion 1), so dominating set is polynomial via the tree DP; task (decide a size-k set + witness), schema (n m k), and output identical"
scaling:
  # REBUILT per audit B4. The old criterion 2 was minimum-dominating-set SIZE on a tree with a
  # rooted parent-list schema (n then 'child parent' links) and integer-only output -- a DIFFERENT
  # task and I/O from the decision+witness criterion 1. It is now the SAME dominating-set decision +
  # witness with the SAME unified schema (n m k) + undirected edges; the only switch is that the
  # graph is a tree (P via the 3-state DP). Ground truth (min DS) is computed by the generator, so k
  # is always correct.
  model_time_limit_s: 2
  chosen_max_size: 200000
  ramp_sizes: [10, 40, 100, 1000, 5000, 20000, 50000, 100000, 150000, 200000]  # n per case 01-10
  ramp_kind:  [yes, no, yes, no, yes, no, yes, no, yes, yes]
  ramp_shapes: [random, random, balanced, random, path, random, balanced, random, path, random]
  gen_command: "tools/gen_family_10.py --criterion 2 --n <n> --seed <s> --kind <yes|no> --shape <random|path|balanced|star>"
  p_timing_margin: "linear 3-state tree DP reference runs in well under 2s at n=200000"
  notes: >-
    Same dominating-set task as criterion 1; the loop-free-hierarchy (tree) promise makes it
    polynomial (3-state tree DP + witness). Verified against a brute-force minimum dominating set on
    400 random trees across all k. A general exponential search does not scale.
