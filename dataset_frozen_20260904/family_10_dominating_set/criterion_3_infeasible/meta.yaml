family: "10"
family_name: dominating_set
criterion: 3
class: INFEASIBLE
problem_letter: C
intended_algorithm: "compute degrees; with budget 0 a degree-0 location cannot be covered, so print the smallest such location"
reduction_note: "isolated vertex has no neighbor to dominate it and budget=0 prevents self-selection"
constraint_delta: "guarantee isolated vertex exists and budget=0; output the vertex id"
judge: exact
time_limit_s: 1
memory_limit_mb: 256
scaling:
  # Corrected (file 26/35) rule. Budget k=0, so a location with no links can never be
  # covered; the reference scans degrees in O(n+m) and prints the smallest isolated
  # location. The baseline (tools/naive_family_10_criterion_3.py) does NOT scan degrees
  # and instead searches for a dominating set of increasing size (C(n,size)) before
  # reporting the isolated location; the search is exponential -> TLEs at scale.
  model_time_limit_s: 1
  baseline_probe:
    - {n: 22,     baseline_s: 0.01}     # pass
    - {n: 30,     baseline_s: 1.40}     # crosses the limit
    - {n: 100000, baseline_s: ">4"}
  baseline_tle_from_size: 28
  chosen_max_size: 100000
  ramp_sizes: [22, 100, 1000, 10000, 100000]   # n per case 03-07
  ramp_isolated_at: [22, 100, 1000, 10000, 100000]   # isolated location at the HIGH index
  ramp_answers: [22, 100, 1000, 10000, 100000]       # smallest isolated index (all differ)
  ramp_baseline: [pass, TLE, TLE, TLE, TLE]
  baseline_tle_confirmed: true          # exit=124 at 1s on cases 04,05,06,07
  gen_command: "tools/gen_family_10.py --criterion 3 --n <n> --m <m> --seed 1 --at high"
  reference_gen_seconds: [{case: "07", n: 100000, seconds: 0.06}]
  notes: >-
    O(n+m) degree scan vs an exponential dominating-set search. The isolated location is at
    the HIGH index (a scan-from-1 must reach it); answers differ across cases so no constant
    passes. The baseline TLEs from n~28 (search size 2-3 explodes); it is exercised at n up
    to 1e5. Statement bounds n<=2e5, m<=2e5, k=0 unchanged.
