family: "13"
family_name: partition
criterion: 3
class: INFEASIBLE
problem_letter: C
intended_algorithm: "certify impossibility: if the total is odd print ODD; else if one task exceeds half the total print MAX; else output g=gcd(durations)>=2 with g not dividing total/2 as MOD g"
reduction_note: "co-NP style impossibility certification; every instance is infeasible for a machine-checkable reason (parity, dominant element, or modular obstruction)"
constraint_delta: "the one documented switch vs A/B: this arm keeps the (n, durations) input schema but asks for a checkable INFEASIBILITY CERTIFICATE rather than a YES/NO decision + witness"
judge: custom
time_limit_s: 2
memory_limit_mb: 256
# audit B4: complexity_switch records the single intended difference from the A/B pair.
complexity_switch: "output contract = infeasibility certificate (diagnosis) instead of decide+witness; input schema unchanged"
scaling:
  # REBUILT per audit B5. The previous design made every instance infeasible via an odd total and
  # required a constant "NO", so print("NO") passed by construction (gameable). This redesign is an
  # infeasibility-CERTIFICATE task: a constant output cannot pass, and THREE mechanisms (odd total;
  # dominant element; modular/parity obstruction) are mixed so a solver that knows only one fails
  # part of the suite.
  #
  # This is a DIAGNOSIS tier, not a runtime tier: correctness (finding the right certificate), not
  # speed, is measured -- the "naive TLEs" framing of the old INFEASIBLE arms is dropped (audit B5).
  mechanisms: [ODD, MOD, MAX]
  mod_divisors_used: [2, 6, 10, 14]
  gen_command: "tools/gen_family_13.py --criterion 3 --n <n> --seed <s> --kind <odd|mod|max>"
  cases:                                 # distinct seeds/kinds -> no duplicate inputs (B6)
    - {case: "01", n: 3,  kind: odd, cert: "ODD"}   # example 1 in the statement
    - {case: "02", n: 3,  kind: max, cert: "MAX"}   # example 2 in the statement
    - {case: "03", n: 20, kind: odd, cert: "ODD"}
    - {case: "04", n: 20, kind: mod, cert: "MOD g"}
    - {case: "05", n: 40, kind: max, cert: "MAX"}
    - {case: "06", n: 40, kind: mod, cert: "MOD g"}
    - {case: "07", n: 100, kind: odd, cert: "ODD"}
    - {case: "08", n: 100, kind: max, cert: "MAX"}
  constant_output_fails: true            # audit B5 / release_check G7: `NO` (or any constant) fails
  notes: >-
    Every instance is genuinely infeasible and carries a certificate the validator checks directly
    against the input: ODD (total odd), MAX (2*max > total), MOD d (d>=2 divides every duration but
    not total/2). A constant program, and a program that only ever prints one mechanism, both fail.
    Statement bound n<=100000. Certificates verified by validator.py, not by literal comparison.
