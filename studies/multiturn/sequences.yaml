length_2:
  - [NPC, P]
  - [NPC, INFEASIBLE]
  - [P, NPC]
  - [P, INFEASIBLE]
  - [INFEASIBLE, P]
  - [INFEASIBLE, NPC]

length_3:
  - [P, NPC, INFEASIBLE]
  - [P, INFEASIBLE, NPC]
  - [NPC, P, INFEASIBLE]
  - [NPC, INFEASIBLE, P]
  - [INFEASIBLE, P, NPC]
  - [INFEASIBLE, NPC, P]
  - [NPC, P, NPC]       # revisiting: NPC -> easier -> hard again
  - [P, NPC, P]         # revisiting: P -> hard -> easy again
  - [INFEASIBLE, P, INFEASIBLE]
  - [NPC, INFEASIBLE, NPC]
  - [P, INFEASIBLE, P]
  - [INFEASIBLE, NPC, INFEASIBLE]

conditions:
  - explicit    # shift is named plainly ("now restrict to 2 shifts")
  - implicit    # shift is embedded in a numeric constraint, class never named

control:
  - same_class  # e.g. NPC -> NPC with a new but still-NPC instance (isolates context degradation)
