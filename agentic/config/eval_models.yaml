# Time constraints (seconds) each NPC statement is evaluated under. The model is
# told the limit in the statement, and the wall-clock limit is ENFORCED per test
# case at grading time (a solution that does not finish scores 0 on that case).
time_limits: [1, 2, 5, 10]

execution:
  # Keep workers <= CPU cores so each grading subprocess gets ~a full core and the
  # measured wall-clock time (which decides the time-limit pass/fail) is not inflated
  # by contention. This box has 12 cores -> 10 leaves headroom for the driver.
  workers: 10                # concurrent tasks
  gen_timeout_s: 600         # per model generation call
  retries: 2
