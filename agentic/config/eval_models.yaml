# =============================================================================
# EVALUATION PANEL — the models we score against the final_dataset statements.
# Separate from models.yaml (the hardening panel) so the two never interfere.
#
# Decoding is identical across the panel (temperature 0.0, top_p 1.0) so any
# difference is attributable to the model, not to sampling — same convention as
# the student panel. All OpenRouter models share OPENROUTER_API_KEY; Gemini uses
# the Google API key. Ollama is fully supported too: add an entry with
# `backend: ollama` and `model_string: "<ollama-tag>"` (no api_key_env needed).
#
# If a model's provider MANDATES reasoning (HTTP 400 when thinking is off, as
# kimi/gpt-oss do on OpenRouter), give it:  reasoning: {max_tokens: 4000, exclude: true}
# =============================================================================
eval_panel:
  # --- Gemma 3 family (OpenRouter) ------------------------------------------
  - id: gemma-3-4b
    backend: openai_compat
    base_url: "https://openrouter.ai/api/v1/"
    model_string: "google/gemma-3-4b-it"
    api_key_env: OPENROUTER_API_KEY
    thinking: false
    temperature: 0.0
    top_p: 1.0
    max_tokens: 32768
    provider: {sort: throughput, allow_fallbacks: true}
    enabled: false   # OpenRouter free pool keeps 429'ing -> served via local Ollama below

  - id: gemma-3-12b
    backend: openai_compat
    base_url: "https://openrouter.ai/api/v1/"
    model_string: "google/gemma-3-12b-it"
    api_key_env: OPENROUTER_API_KEY
    thinking: false
    temperature: 0.0
    top_p: 1.0
    max_tokens: 32768
    provider: {sort: throughput, allow_fallbacks: true}
    enabled: true

  - id: gemma-3-27b
    backend: openai_compat
    base_url: "https://openrouter.ai/api/v1/"
    model_string: "google/gemma-3-27b-it"
    api_key_env: OPENROUTER_API_KEY
    thinking: false
    temperature: 0.0
    top_p: 1.0
    max_tokens: 32768
    provider: {sort: throughput, allow_fallbacks: true}
    enabled: true

  # --- Local Ollama serving for gemma-3-4b (OpenRouter free pool 429'd) ----------
  # Same id "gemma-3-4b" so results slot into the same grade paths. No API key needed.
  # For higher precision pull an fp16 tag and change model_string (e.g. gemma3:4b-it-fp16).
  - id: gemma-3-4b
    backend: ollama
    model_string: "gemma3:4b"
    thinking: false
    temperature: 0.0
    top_p: 1.0
    max_tokens: 8192
    enabled: true

