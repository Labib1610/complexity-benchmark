teacher:
  id: gemini-3.6-flash
  backend: openai_compat
  base_url: "https://generativelanguage.googleapis.com/v1beta/openai/"
  model_string: "gemini-3.6-flash"
  api_key_env: GEMINI_API_KEY
  temperature: 0.9          # higher: we want version diversity
  max_tokens: 8192

verifier:                    # separate model, not teacher, not a student
  id: gemini-3-flash-lite-verifier
  backend: openai_compat
  base_url: "https://generativelanguage.googleapis.com/v1beta/openai/"
  model_string: "gemini-3.1-flash-lite"
  api_key_env: GEMINI_API_KEY
  temperature: 0.0
  max_tokens: 2048

students:
  - id: gemini-3-flash-lite
    backend: openai_compat
    base_url: "https://generativelanguage.googleapis.com/v1beta/openai/"
    model_string: "gemini-3.1-flash-lite"
    api_key_env: GEMINI_API_KEY
    thinking: false
    max_tokens: 4096
    enabled: true

  # --- OpenRouter students (cloud; run concurrently over the API) ---------------
  - id: gemma-4-31b
    backend: openai_compat
    base_url: "https://openrouter.ai/api/v1/"
    model_string: "google/gemma-4-31b-it"
    api_key_env: OPENROUTER_API_KEY
    thinking: false
    max_tokens: 4096
    enabled: true

  - id: qwen3.5-flash
    backend: openai_compat
    base_url: "https://openrouter.ai/api/v1/"
    model_string: "qwen/qwen3.5-flash-02-23"
    api_key_env: OPENROUTER_API_KEY
    thinking: false
    max_tokens: 4096
    enabled: true

  - id: gpt-oss-20b
    backend: openai_compat
    base_url: "https://openrouter.ai/api/v1/"
    model_string: "openai/gpt-oss-20b"
    api_key_env: OPENROUTER_API_KEY
    thinking: true
    max_tokens: 12288
    enabled: true

  - id: gpt-4o-mini
    backend: openai_compat
    base_url: "https://openrouter.ai/api/v1/"
    model_string: "openai/gpt-4o-mini"
    api_key_env: OPENROUTER_API_KEY
    thinking: false
    max_tokens: 4096
    enabled: true

  # --- local Ollama students: DISABLED (too slow on this GPU) -------------------
  # - id: qwen3-32b
  #   backend: ollama
  #   model_string: "qwen3:32b"
  #   thinking: true
  #   max_tokens: 12288
  #   enabled: false
  # - id: gemma3-27b
  #   backend: ollama
  #   model_string: "gemma3:27b"
  #   thinking: false
  #   max_tokens: 4096
  #   enabled: false
  # - id: gpt-oss-20b
  #   backend: ollama
  #   model_string: "gpt-oss:20b"
  #   thinking: true
  #   max_tokens: 12288
  #   enabled: false
  # - id: phi4
  #   backend: ollama
  #   model_string: "phi4"
  #   thinking: false
  #   token_budget: 4096
  #   enabled: false

held_out: []                 # populated later; teacher must never see these

execution:
  ollama_parallel: false     # sequential for now; flip to true on a bigger GPU
  ollama_max_workers: 1      # raise with the flag above
  api_parallel: true         # API students can run concurrently
  api_max_workers: 3
  request_timeout_s: 1800
  retries: 3
