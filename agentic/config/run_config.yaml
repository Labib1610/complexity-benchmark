family: "01"
criteria: [1, 2]     # criterion 3 (infeasible) DROPPED 2026-09-11 -- always 100%, non-discriminating.
                     # Archived under _archive_infeasible_dropped_20260911/. Only NPC(1) and P(2) remain.
versions_per_criterion: 40     # target; planner fills it from sources 1-4
max_generation: 2              # 0 = seed-derived only
composition_enabled: true
samples_seed_stride: 1000      # sub-seed spacing for repeat draws
seed_tests: small_only         # cases 01-04; never the scaled ones
strategy_plan: balanced        # see strategies/PLAN.md
seed: 7
stop_on_gate_fail: false       # keep failed versions, mark them, review later

# --- gate scoring (file 50, PART B) -----------------------------------------
# Two-part scheme: hard constraints (H1-H5, binary/fatal) + graded criteria
# (G1-G4, 0-5). Acceptance: all hard pass AND G1>=4 AND G2>=4 AND G3>=5 AND G4>=3.
gate:
  thresholds: {G1: 4, G2: 4, G3: 5, G4: 3}
  composite_weights: {G3: 0.40, G1: 0.30, G2: 0.20, G4: 0.10}
  solver_roundtrip:
    # H5: writes a solution for the rewritten statement; it must pass the seed's
    # ANCHOR tests (n<=4, trivial). A REASONING model is the wrong tool here - it
    # burns its whole budget thinking about a 4-node graph and emits no code.
    # Use a cheap NON-reasoning model. Must not be a student, the held-out model,
    # the teacher, or the verifier.
    enabled: false
    model_id: gemini-3.7-flash-lite-solver
    # anchor+corner: the solver must also handle the STANDARD corner cases (adversarial
    # adv_* cases are excluded), so accepted statements stay solvable on ordinary edge
    # cases -- raises the difficulty ceiling. If you swap in a weak solver, revert to anchor.
    tests: anchor
    backend: openai_compat
    base_url: "https://generativelanguage.googleapis.com/v1beta/openai/"
    model_string: "gemini-3.7-flash"
    api_key_env: GEMINI_API_KEY
    temperature: 0.0
    top_p: 1.0
    max_tokens: 4096
    thinking: false

feedback_loop:
  seed_selection: top_k        # top_k | all | explicit
  top_k: 14                    # CHANGED 2026-09-11: take the 14 HARDEST variants (biggest student-drop)
  include_random: 0            # no random diversity picks -- user wants strictly the hardest seeds
  target_lineages: 14          # normalize to a FIXED lineage count per criterion across families
                               # (tops up with random accepted variants only if <14 hardest exist)
  explicit: []                 # version ids when seed_selection: explicit
  lineage_workers: 8           # lineages are independent -> run this many concurrently

  # generate N candidate rewrites per depth, gate all, keep the highest-composite
  # ACCEPTED one (B4 selector). This multiplies teacher + verifier + H5 calls, so
  # 2 is the budget-conscious setting; raise to 3 for better selection if funded.
  candidates_per_depth: 2

  max_depth: 10                # file 52 change 6: pass counts were still moving at 5-6
  stop_when_all_fail: true
  retire_failed_students: true # defeated students stop driving hardening
  retest_retired: true         # but are still run at every later depth
  min_passers_to_continue: 1

  # --- file 52 change 1 (revised): defeat = wrong OR too-slow -------------------
  #   wrong_answer_only = defeat on WRONG_ANSWER/RUNTIME_ERROR only (TLE is a survivor)
  #   wrong_or_slow     = ALSO defeat when a solution exceeds tle_ceiling_s (the NP-hard
  #                       intractability signal: a correct-but-exponential solution that
  #                       cannot finish within the ceiling is defeated)
  #   all_failures      = any non-PASS is a defeat
  # elapsed_s is always recorded regardless of mode.
  hardening_target: wrong_or_slow       # wrong_answer_only | wrong_or_slow | all_failures
  tle_ceiling_s: 300                    # under wrong_or_slow this is the difficulty threshold

  # --- adversarial corner-case engine (defeat by edge cases + intractable instances) ---
  adversarial_corner:
    enabled: true                       # regenerate corner cases against survivors each depth
    cases_per_survivor: 4               # differential-testing cases to keep per survivor
    candidate_pool: 40                  # candidate inputs generated per pass
    on_structural_floor: true           # when rewording is exhausted, pivot to corner attack

  # --- file 52 change 2: agentic memory ----------------------------------------
  memory_block_max_tokens: 1500         # hard cap on the {MEMORY_BLOCK} fed to the teacher

  # --- file 52 change 4: aggressive mode after the strategy library is exhausted
  aggressive_from_depth: 3
  aggressive_requires_named_method: true

  # --- file 52 change 5: gate negotiation (replaces gate_retry) -----------------
  gate_negotiation_rounds: 4   # teacher revises using the gate's actionable feedback
  negotiation_transcript: true # save every teacher attempt + gate response to negotiation.json

  skip_students_failing_seed: false  # CHANGED 2026-09-11: keep ALL students, even ones that fail the
                                     # unmodified seed (e.g. gpt-oss fails job-shop seed but is strong
                                     # elsewhere) -- dropping them loses good discriminator feedback.

  # which test tier(s) decide PASS for retirement/steering (file 48):
  #   all           = anchor AND corner AND scaled must pass
  #   anchor+corner = ignore scaled (reproduces pre-file-48 behaviour)
  #   scaled        = only the intractability tier decides
  # tiers are ALWAYS scored and recorded separately regardless of this setting.
  scoring_tier: all

  # on failure at a depth, try these edit strategies in order before giving up
  fallback_ladder: [S12_primary, S12_secondary, S07, S02_aggressive]
  ladder_attempts_per_depth: 4

# --- held-out transfer check (run ONCE, after the campaign) -------------------
# Runs models.yaml:held_out over the FINAL statements of every lineage. Answers
# "is this hard in general, or only for the panel we tuned against?"
held_out_check:
  enabled: true
  scope: final_depth_only      # only each lineage's last statement
  tiers: all