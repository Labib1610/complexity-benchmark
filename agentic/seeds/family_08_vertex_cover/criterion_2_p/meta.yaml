family: "08"
family_name: vertex_cover
criterion: 2
class: P
problem_letter: B
intended_algorithm: "2-colour to recover the two wings; Hopcroft-Karp maximum matching; by Koenig's theorem the minimum vertex cover equals the maximum matching, and its witness is (A minus Z) union (B intersect Z) from alternating reachability; decide k >= min cover and output it"
reduction_note: "minimum vertex cover in bipartite graphs is polynomial via Koenig's theorem"
constraint_delta: "same VERTEX COVER decision + witness and I/O as criterion 1; the one switch is that the graph is bipartite, making it polynomial"
judge: custom
time_limit_s: 2
memory_limit_mb: 256
# audit B4: this arm now shares the exact task/schema/output of criterion 1.
complexity_switch: "graph class only: the graph is bipartite (vs general in criterion 1), so vertex cover is polynomial via matching/Koenig; task (decide a size-k cover + witness), schema (n m k), and output identical"
scaling:
  # REBUILT per audit B4. The old criterion 2 was minimum-vertex-cover SIZE on a bipartite graph
  # with a two-wing (nA,nB) schema and integer-only output -- a DIFFERENT task and I/O from the
  # decision+witness criterion 1. It is now the SAME vertex-cover decision + witness with the SAME
  # unified schema (n m k); the only switch is that the graph is bipartite (P via Koenig). Ground
  # truth (min cover) is computed by the generator via matching, so k is always correct.
  model_time_limit_s: 2
  chosen_max_size: 50000
  ramp_sizes: [10, 40, 100, 500, 1000, 5000, 10000, 20000, 35000, 50000]  # n per case 01-10
  ramp_kind:  [yes, no, yes, no, yes, no, yes, no, yes, yes]
  gen_command: "tools/gen_family_08.py --criterion 2 --n <n> --seed <s> --kind <yes|no>"
  p_timing_margin: "Hopcroft-Karp + Koenig reference runs in well under 2s at n=50000 (sparse, ~3n edges)"
  notes: >-
    Same vertex-cover task as criterion 1; the two-wing (bipartite) promise makes it polynomial
    (matching + Koenig witness). A model that recognises the structure and applies Koenig passes; a
    general exponential search does not scale. Verified against brute force on small graphs.
