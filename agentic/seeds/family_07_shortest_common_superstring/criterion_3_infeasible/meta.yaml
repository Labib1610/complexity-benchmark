family: "07"
family_name: shortest_common_superstring
criterion: 3
class: INFEASIBLE
problem_letter: C
intended_algorithm: "scan fragments in order; print the 1-based index of the first fragment that contains the forbidden string F (certifies infeasibility)"
reduction_note: "contradictory required substrings make any common superstring impossible"
constraint_delta: "guarantee contradictory substrings exist; output the conflicting pair as certificate"
judge: exact
time_limit_s: 1
memory_limit_mb: 256
scaling:
  # Corrected (file 26/32) rule. The reference scans fragments for F in O(k*|F|) and
  # prints the first fragment index containing it. The realistic baseline
  # (tools/naive_family_07_criterion_3.py) does NOT notice the offending fragment and
  # instead tries to assemble a shortest common superstring first (permutation search,
  # exponential in the number of fragments), only afterwards scanning for F. It TLEs once
  # there are more than ~11 fragments; the O(k*|F|) scan is instant.
  model_time_limit_s: 1
  baseline_probe:                       # SCS-attempt baseline, F at high index, alphabet ab
    - {k: 8,  baseline_s: 0.03}
    - {k: 10, baseline_s: 0.56}         # last under 1s
    - {k: 12, baseline_s: ">4"}         # crosses the limit
    - {k: 18, baseline_s: ">4"}
  baseline_tle_from_size: 12
  chosen_max_size: 18                   # baseline is exponential in k; kept small
  ramp_sizes: [10, 12, 14, 16, 18]      # cases 03-07 (k)
  ramp_forbidden_at: [10, 12, 14, 16, 18]   # offending fragment at the HIGH index
  ramp_answers: [10, 12, 14, 16, 18]        # smallest fragment index containing F
  ramp_baseline: [pass, TLE, TLE, TLE, TLE]
  baseline_tle_confirmed: true          # exit=124 at 1s on cases 04,05,06,07
  gen_command: "tools/gen_family_07.py --criterion 3 --k <k> --len 12 --seed 1 --F abab --at high"
  reference_gen_seconds: [{case: "07", k: 18, seconds: 0.01}]   # O(k*|F|) scan
  notes: >-
    The offending fragment makes the answer a single index found in O(k*|F|). A solution
    that instead tries to assemble the superstring (exponential permutation search) TLEs
    from k~12; the offending fragment sits at the HIGH index so the search runs before
    the scan would reach it. Answers differ across cases, so no constant index passes.
    Sizes are small (k<=18) because the baseline is exponential in the fragment count;
    statement bound k<=1e5 unchanged.
