family: "07"
family_name: shortest_common_superstring
criterion: 2
class: P
problem_letter: B
intended_algorithm: "compute max suffix-prefix overlap both directions via KMP prefix-function, merge each way (plus containment cases), pick shortest then lexicographically smallest; O(|s1|+|s2|)"
reduction_note: "2-string overlap superstring computable in linear time via KMP overlap"
constraint_delta: "exactly 2 strings; linear-time overlap merge is polynomial"
judge: exact
time_limit_s: 1
memory_limit_mb: 256
scaling:
  # Corrected (file 26/32) rule. Real asymptotic gap: the reference computes the max
  # suffix-prefix overlap via KMP in O(n); the realistic baseline
  # (tools/naive_family_07_criterion_2.py) tests each candidate overlap length by slicing
  # (a[-L:] == b[:L]), which is O(L) per length regardless of an early mismatch, so it is
  # O(n^2) whenever the true overlap is far below the string length. Output is identical
  # (same candidate merges), so a correct solution passes; the O(n^2) simulator TLEs.
  model_time_limit_s: 1
  baseline_probe:                       # slicing overlap, worst-case strings
    - {n: 100000, baseline_s: 0.23, reference_s: 0.08}   # fast: memcpy has a tiny constant
    - {n: 200000, baseline_s: 0.88}                       # last under 1s
    - {n: 300000, baseline_s: 2.03, reference_s: 0.18}    # crosses the limit
    - {n: 500000, baseline_s: 5.6}
  baseline_tle_from_size: 300000
  chosen_max_size: 500000
  ramp_sizes: [1000, 500000, 300000, 400000, 500000]   # n per case 06-10
  ramp_specs:
    - {case: "06", n: 1000,   mode: worst}
    - {case: "07", n: 500000, mode: identical}   # naive returns at L=n immediately -> pass
    - {case: "08", n: 300000, mode: worst}
    - {case: "09", n: 400000, mode: long}
    - {case: "10", n: 500000, mode: worst}
  ramp_baseline: [pass, pass, TLE, TLE, TLE]
  baseline_tle_confirmed: true          # exit=124 at 1s on cases 08,09,10
  gen_command: "tools/gen_family_07.py --criterion 2 --n <n> --seed 1 --mode <worst|long|identical>"
  reference_gen_seconds: [{case: "10", n: 500000, seconds: 0.32}]   # KMP O(n)
  notes: >-
    Bound raised from length<=1e5 to length<=5e5. At 1e5 the slicing naive is only ~0.23s
    (Python slice compare is a fast C memcpy, so O(n^2) has a tiny constant); it needs
    n~3e5 to cross the 1s limit. The reference (KMP) stays under 0.35s. Identical strings
    (case 07) are the pass case even at 5e5, since the naive returns the full overlap on
    the first length it tests.
