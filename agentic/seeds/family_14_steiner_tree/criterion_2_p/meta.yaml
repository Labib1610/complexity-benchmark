family: "14"
family_name: steiner_tree
criterion: 2
class: P
problem_letter: B
intended_algorithm: "the cabling graph is a tree, so the minimum subtree connecting the required sites is unique: root the tree, count required sites per subtree, and sum the weights of edges with required sites on both sides; O(n)"
reduction_note: "when all vertices are required terminals the Steiner tree equals the MST; polynomial"
constraint_delta: "all vertices are required; Steiner tree reduces to MST; Kruskal O(m log m)"
judge: exact
time_limit_s: 2
memory_limit_mb: 256
# audit B4: unified schema (n m t + required sites) with a tree-graph promise (was MST on a
# different n m schema). Same min-cost objective as criterion 1.
complexity_switch: "the cabling graph is a tree (vs a general graph in criterion 1), so the Steiner tree is polynomial; same schema (n m t + required sites) and min-cost output as A"
scaling:
  # Corrected (file 26/39) rule. When every site is required the min connected subgraph is a
  # minimum spanning tree. The reference is Kruskal with path-compressed union-find O(m log m);
  # the baseline (tools/naive_family_14_criterion_2.py) is PRIM WITHOUT A HEAP -- an O(n) linear
  # scan for the min-key vertex each of n steps, O(n^2) -- so it TLEs at n=2e5 while Kruskal is fast.
  model_time_limit_s: 2
  baseline_probe:                       # Prim O(n^2) vs Kruskal O(m log m)
    - {n: 5000,   baseline_s: 0.61}     # last under 2s
    - {n: 10000,  baseline_s: 2.24}     # crosses the limit
    - {n: 100000, baseline_s: ">5"}
  baseline_tle_from_size: 8000
  chosen_max_size: 200000
  ramp_sizes: [1000, 5000, 10000, 100000, 200000]   # n per case 06-10
  ramp_specs:
    - {case: "06", n: 1000,   m: 2000,   equal: true}    # equal-weight edges (tie handling)
    - {case: "07", n: 5000,   m: 10000}
    - {case: "08", n: 10000,  m: 20000}
    - {case: "09", n: 100000, m: 200000}
    - {case: "10", n: 200000, m: 200000, equal: true}    # equal-weight at scale
  ramp_baseline: [pass, pass, TLE, TLE, TLE]
  baseline_tle_confirmed: true          # exit=124 at 2s on cases 08,09,10
  gen_command: "tools/gen_family_14.py --criterion 2 --n <n> --m <m> --seed 1 [--equal]"
  reference_gen_seconds: [{case: "09", n: 100000, seconds: 0.32}]
  notes: >-
    O(m log m) Kruskal vs O(n^2) heapless Prim; TLEs from n~8000. Cases 06 and 10 use all-equal
    edge weights to stress tie handling; a random spanning tree guarantees connectivity. Answers
    differ so no constant passes. Statement bounds n<=2e5, m<=2e5 unchanged.
