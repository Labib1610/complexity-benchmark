family: "06"
family_name: bin_packing
criterion: 2
class: P
problem_letter: B
intended_algorithm: "items may be split, so minimum containers = ceil(sum(weights) / C); sum in O(n) and integer ceil-divide"
reduction_note: "fractional relaxation solvable in O(n log n); items may be split across bins"
constraint_delta: "items can be fractionally split; continuous relaxation is polynomial"
judge: exact
time_limit_s: 1
memory_limit_mb: 256
scaling:
  # Corrected (file 26/31) rule. Real asymptotic gap: material may be split, so the
  # answer is ceil(sum/C), computed in O(n). The realistic baseline
  # (tools/naive_family_06_criterion_2.py) SIMULATES filling containers, closing one
  # container at a time -- O(n + sum/C). With large absolute weights and a small C the
  # answer (= number of iterations) is enormous, so the simulator TLEs while the O(n)
  # ceil division is instant.
  model_time_limit_s: 1
  baseline_probe:                       # bin-by-bin simulator, n=2e5, weights ~1e9
    - {C: 5000000, answer: 22016728,  baseline_s: 0.61}   # last under 1s
    - {C: 1000000, answer: 110083636, baseline_s: 2.9}    # crosses 1s
    - {C: 500000,  answer: 220167272, baseline_s: 6.0}
    - {C: 200000,  answer: 550418178, baseline_s: 15.0}
  baseline_tle_from_size: 110000000     # answer (=sum/C) above which the simulator TLEs
  chosen_max_size: 200000               # n; the discriminator is C (drives sum/C)
  ramp_sizes: [1000, 200000, 200000, 200000, 200000]   # n per case 06-10
  ramp_specs:
    - {case: "06", n: 1000,   C: 1000000000}
    - {case: "07", n: 200000, C: 5000000}
    - {case: "08", n: 200000, C: 1000000}
    - {case: "09", n: 200000, C: 500000}
    - {case: "10", n: 200000, C: 200000, exact: true}   # total is an exact multiple of C
  ramp_baseline: [pass, pass, TLE, TLE, TLE]
  baseline_tle_confirmed: true          # exit=124 at 1s on cases 08,09,10
  gen_command: "tools/gen_family_06.py --criterion 2 --n <n> --C <C> --seed 1 [--exact]"
  reference_gen_seconds: [{case: "10", n: 200000, seconds: 0.04}]   # all O(n), instant
  notes: >-
    The O(n) ceil-division reference is instant; a natural bin-by-bin simulator is
    O(n + sum/C) and TLEs once sum/C exceeds ~1e8 (cases 08-10). Case 10 makes the
    total an exact multiple of C (ceil edge). Statement bounds unchanged (n<=2e5,
    C<=1e9); the wall is reached by shrinking C, not by n.
