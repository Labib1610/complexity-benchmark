family: "06"
family_name: bin_packing
criterion: 1
class: NPC
problem_letter: A
intended_algorithm: "backtracking: place items heaviest-first into the lowest-load feasible container, with a symmetry cut skipping equivalent empty containers"
reduction_note: "BIN PACKING; NP-complete; reduction from PARTITION"
constraint_delta: "anchor variant (NP-complete base)"
judge: custom
time_limit_s: 5
memory_limit_mb: 256
scaling:
  # Corrected (file 26/31) rule. THE GAP IS SYMMETRY BREAKING, NOT ASYMPTOTICS.
  # Reference and baseline are both heaviest-first backtracking; the reference adds a
  # symmetry cut ("don't try more than one currently-empty container -- they are
  # interchangeable"), the baseline (tools/naive_family_06_criterion_1.py) does not.
  # On instances with duplicate weights near C/2 and total = k*C (a perfect packing is
  # required), the no-symmetry baseline explores astronomically many equivalent empty-
  # container orderings and explodes, while the symmetry-pruned reference refutes/solves
  # in milliseconds -- so the reference generates ground truth instantly.
  model_time_limit_s: 5
  baseline_probe:                       # no-symmetry baseline vs symmetry reference, C=1000
    - {k: 8,  n: 16, feasible: false, baseline_s: 0.10, reference_s: 0.01}
    - {k: 10, n: 20, feasible: false, baseline_s: ">8", reference_s: 0.01}   # explodes
    - {k: 12, n: 24, feasible: false, baseline_s: ">8", reference_s: 0.01}
    - {k: 14, n: 28, feasible: false, baseline_s: ">8", reference_s: 0.01}
  baseline_tle_from_size: 20            # n (=2k); k=10
  chosen_max_size: 28                   # n; reference is ~0.01s throughout (symmetry cut)
  ramp_sizes: [16, 16, 20, 24, 28]      # n per case 06-10
  ramp_specs:
    - {case: "06", k: 8,  feasible: true,  verdict: YES}
    - {case: "07", k: 8,  feasible: false, verdict: NO}
    - {case: "08", k: 10, feasible: false, verdict: NO}
    - {case: "09", k: 12, feasible: false, verdict: NO}
    - {case: "10", k: 14, feasible: false, verdict: NO}
  ramp_verdicts: [YES, NO, NO, NO, NO]
  ramp_baseline: [pass, pass, TLE, TLE, TLE]
  baseline_tle_confirmed: true          # exit=124 at 5s on cases 08,09,10
  gen_command: "tools/gen_family_06.py --criterion 1 --k <k> --C 1000 --seed 1 --feasible <yes|no>"
  reference_gen_seconds: [{case: "10", n: 28, seconds: 0.01}]   # all instant
  notes: >-
    Criterion 1's gap comes from SYMMETRY BREAKING, not an asymptotic difference: both
    solvers are heaviest-first backtracking, but the reference's interchangeable-empty-
    container cut turns k! equivalent branches into one. The hard cases are NO perfect-
    packing instances (total = k*C with duplicate near-C/2 weights) on which the no-
    symmetry baseline explodes. Statement bound n<=18 -> n<=28 (k<=18 unchanged).
    NOTE: no hard-YES-TLE case -- feasible instances let the baseline find a packing
    before exhausting the symmetric tree, so (like family 03 crit1) the tier is non-
    gameable by constants but a "search-with-timeout-fallback-to-NO" heuristic would
    pass; deferred to the agentic phase.
