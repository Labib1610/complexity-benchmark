family: "03"
family_name: hamiltonian_path
criterion: 1
class: NPC
problem_letter: A
intended_algorithm: "bitmask DP over vertex subsets; dp[mask][v]=True if Hamiltonian path on mask ends at v; O(2^n * n^2); reconstruct lex-smallest by greedy forward selection"
reduction_note: "HAMILTONIAN PATH; NP-complete; reduction from 3-SAT via gadgets"
constraint_delta: "anchor variant (NP-complete base)"
judge: exact
time_limit_s: 5
memory_limit_mb: 256
scaling:
  # Corrected (file 26/28) rule: size chosen by where the REALISTIC baseline exceeds
  # time_limit_s. Ground truth is generated offline/unlimited. Huge asymptotic gap:
  # reference is bitmask DP O(2^n * n^2); the realistic baseline
  # (tools/naive_family_03_criterion_1.py) is recursive DFS backtracking O(n!), the
  # natural solution a model writes without bitmask DP. Both output the identical
  # lex-smallest path (verified on anchors + generated YES cases).
  model_time_limit_s: 5
  baseline_probe:                       # DFS backtracking on hard-NO (dense unbalanced bipartite)
    - {size: 12, baseline_s: 0.3}
    - {size: 13, baseline_s: 0.7}       # last size under 5s
    - {size: 14, baseline_s: 11.7}      # crosses the limit
    - {size: 15, baseline_s: 39.0}      # decisive TLE
  baseline_tle_from_size: 14
  chosen_max_size: 20                   # reference DP ~7s offline at n=20; dp mem = 2^20*20 = 20MB
  ramp_sizes: [12, 13, 15, 17, 20]      # cases 05-09
  ramp_seeds: [1, 1, 1, 1, 1]
  ramp_paths: [yes, yes, no, no, no]    # generator --path; hard-NO = dense unbalanced bipartite
  ramp_verdicts: [YES, YES, NO, NO, NO] # 2 YES so a constant "NO" cannot pass the tier
  ramp_baseline: [pass, pass, TLE, TLE, TLE]
  baseline_tle_confirmed: true          # exit=124 at 5s on cases 07,08,09
  gen_command: "tools/gen_family_03.py --criterion 1 --n <n> --seed 1 --path <yes|no> [--m round(1.6n) for yes]"
  reference_gen_seconds:                # informational; offline one-time cost
    - {case: "05", size: 12, seconds: 0.0}
    - {case: "06", size: 13, seconds: 0.1}
    - {case: "07", size: 15, seconds: 0.2}
    - {case: "08", size: 17, seconds: 0.7}
    - {case: "09", size: 20, seconds: 7.3}
  notes: >-
    Hard NO instances are dense, unbalanced bipartite graphs (parts differ by >=2, so
    no Hamiltonian path); naive DFS explores an enormous alternating search before
    failing while the bitmask-DP reference is fast. Statement bound n<=18 -> n<=20.
    NOTE: no hard-YES-TLE case exists -- Hamiltonian YES instances let DFS stop at the
    first path, so (unlike 3-coloring) a satisfiable instance that TLEs a naive DFS
    could not be found by search. The tier stays non-gameable by constants (mixed
    YES/NO, and YES needs the exact lex path), but a "DFS-with-timeout-fallback-to-NO"
    heuristic would pass; closing that (per file 49's agentic hardening) would need a
    constructed hard-YES and is deferred until the agentic phase reaches this family.
