family: "09"
family_name: clique_independent_set
criterion: 2
class: P
problem_letter: B
intended_algorithm: "Hopcroft-Karp maximum matching between the two campuses; by König's theorem the maximum independent set size = (nA+nB) - maxMatching"
reduction_note: "maximum independent set in bipartite graphs is polynomial via König's theorem"
constraint_delta: "graph restricted to bipartite; König complement theorem applies; O(n*sqrt(n))"
judge: exact
time_limit_s: 2
memory_limit_mb: 256
scaling:
  # Corrected (file 26/34) rule. Via Koenig's theorem the maximum independent set of a
  # bipartite graph = (nA+nB) - maximum matching. The reference is Hopcroft-Karp O(E*sqrt V)
  # (already HK -- NO reference change needed). The realistic baseline
  # (tools/naive_family_09_criterion_2.py) computes the matching with Kuhn's O(V*E), the same
  # integer, but TLEs on a lower-triangular staircase (long augmenting chains).
  model_time_limit_s: 2
  baseline_probe:                       # Kuhn vs HK on the staircase (nA=nB=k)
    - {k: 800,  m: 320400, kuhn_s: 1.23, hk_s: 0.13}   # last under 2s
    - {k: 1000, m: 500500, kuhn_s: 3.81, hk_s: 0.18}   # crosses 2s
    - {k: 1200, m: 720600, kuhn_s: ">8", hk_s: 0.26}
  baseline_tle_from_size: 900           # nA=nB
  chosen_max_size: 1200
  ramp_sizes: [1000, 800, 1000, 1100, 1200]   # nA=nB per case (06 is edgeless)
  ramp_specs:
    - {case: "06", nA: 1000, nB: 1000, mode: empty}   # edge case: IS = nA+nB = 2000
    - {case: "07", nA: 800,  nB: 800,  mode: hard}
    - {case: "08", nA: 1000, nB: 1000, mode: hard}
    - {case: "09", nA: 1100, nB: 1100, mode: hard}
    - {case: "10", nA: 1200, nB: 1200, mode: hard}
  ramp_answers: [2000, 800, 1000, 1100, 1200]   # max independent set size (all differ)
  ramp_baseline: [pass, pass, TLE, TLE, TLE]
  baseline_tle_confirmed: true          # exit=124 at 2s on cases 08,09,10
  gen_command: "tools/gen_family_09.py --criterion 2 --nA <k> --nB <k> --mode <hard|empty> --seed 1"
  reference_gen_seconds: [{case: "10", nA: 1200, seconds: 0.26}]
  notes: >-
    Kuhn (O(V*E)) TLEs on the staircase from nA=nB~900 while Hopcroft-Karp stays under 0.3s.
    Gap is narrow (Kuhn is fast in practice) so m bound raised 2e5 -> 8e5; nA,nB<=1e5 unchanged.
    Case 06 is the edgeless edge case (independent set = nA+nB). Answers differ so no constant.
