family: "13"
family_name: partition
criterion: 2
class: P
problem_letter: B
intended_algorithm: "if total is odd print NO; else boolean subset-sum DP to total/2 with predecessor tracking to reconstruct one group; O(n*S)"
reduction_note: "partition with small integers is pseudo-polynomial DP; polynomial given bounded value range"
constraint_delta: "values bounded by n; total sum <=n^2; DP runtime is polynomial in input size"
judge: custom
time_limit_s: 2
memory_limit_mb: 256
scaling:
  # Corrected (file 26/38) rule. Small durations (<=100) so a subset-sum DP to total/2 is
  # polynomial O(n*S). The realistic baseline (tools/naive_family_13_criterion_2.py) is a 2^n
  # include/exclude search; on even-sum-but-UNSPLITTABLE instances it exhausts and TLEs at any
  # n>=~30, while the DP is fast. (YES instances with dense small values are found quickly by the
  # search, so the discriminating TLE cases are the unsplittable ones.)
  model_time_limit_s: 2
  baseline_probe:                       # 2^n search
    - {n: 20,   splittable: yes, baseline_s: 0.01}   # pass
    - {n: 200,  splittable: no,  baseline_s: ">4"}   # TLE
    - {n: 2000, splittable: no,  baseline_s: ">4"}
  baseline_tle_from_size: 30            # n (unsplittable)
  chosen_max_size: 2000
  ramp_sizes: [20, 200, 500, 1000, 2000]   # n per case 06-10
  ramp_specs:
    - {case: "06", n: 20,   splittable: yes, verdict: YES}   # pass
    - {case: "07", n: 200,  splittable: yes, verdict: YES}   # pass (search finds it fast)
    - {case: "08", n: 500,  splittable: no,  verdict: NO}
    - {case: "09", n: 1000, splittable: no,  verdict: NO}
    - {case: "10", n: 2000, splittable: no,  verdict: NO}
  ramp_baseline: [pass, pass, TLE, TLE, TLE]
  baseline_tle_confirmed: true          # exit=124 at 2s on cases 08,09,10
  gen_command: "tools/gen_family_13.py --criterion 2 --n <n> --seed 1 --splittable <yes|no>"
  reference_gen_seconds: [{case: "10", n: 2000, seconds: 2.14}]
  # POOR-CONSTANTS DP NOTE: the reference implements the O(n*S) DP as a BOOLEAN LIST and takes
  # ~2.1s at n=2000 (target S ~ 5e4) -- above the 2s limit. So the passing solution must be the
  # efficient bitset DP (reach as an int, reach |= reach<<c: O(n*S/64)); a boolean-list DP is the
  # "poor constants" case that strains, exactly as file 38 describes. .out generation is offline.
  notes: >-
    O(n*S) DP vs 2^n search. Unsplittable cases make the 2^n search exhaust (TLE); dense small-
    value YES instances it solves quickly (pass). The efficient passing solution is a bitset DP;
    the reference's boolean-list DP strains (~2.1s at n=2000). Statement bounds n<=2000, values<=100
    unchanged.
