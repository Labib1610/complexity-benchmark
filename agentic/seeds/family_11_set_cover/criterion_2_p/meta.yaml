family: "11"
family_name: set_cover
criterion: 2
class: P
problem_letter: B
intended_algorithm: "consultants are edges between frontend and backend skills; minimum edge cover = (uA+uB) - maxMatching (Gallai); maximum matching via Hopcroft-Karp on the two skill groups"
reduction_note: "set cover with sets of size <=2 equals bipartite edge cover; König's theorem applies"
constraint_delta: "sets restricted to size <=2; reduces to edge cover which is polynomial via König"
judge: exact
time_limit_s: 2
memory_limit_mb: 256
scaling:
  # Corrected (file 26/36) rule. Size-2 sets = edges; minimum edge cover = (uA+uB) - maximum
  # matching (Gallai). The reference is Hopcroft-Karp O(E*sqrt V) (already HK -- no change).
  # The baseline (tools/naive_family_11_criterion_2.py) computes the matching with Kuhn's
  # O(V*E), the same integer, but TLEs on a lower-triangular staircase (long augmenting chains).
  model_time_limit_s: 2
  baseline_probe:                       # Kuhn vs HK on the staircase (uA=uB=k)
    - {k: 600,  s: 180300, kuhn_s: 0.53, hk_s: 0.13}   # last under 2s
    - {k: 800,  s: 320400, kuhn_s: 1.96, hk_s: 0.23}
    - {k: 1000, s: 500500, kuhn_s: 4.62, hk_s: 0.35}   # crosses 2s
    - {k: 1200, s: 720600, kuhn_s: ">8", hk_s: 0.52}
  baseline_tle_from_size: 900           # uA=uB
  chosen_max_size: 1200
  ramp_sizes: [1000, 600, 1000, 1100, 1200]   # uA=uB per case (06 is a star)
  ramp_specs:
    - {case: "06", uA: 1000, uB: 1000, mode: star}   # star: known small edge cover
    - {case: "07", uA: 600,  uB: 600,  mode: hard}
    - {case: "08", uA: 1000, uB: 1000, mode: hard}
    - {case: "09", uA: 1100, uB: 1100, mode: hard}
    - {case: "10", uA: 1200, uB: 1200, mode: hard}
  ramp_answers: [1998, 600, 1000, 1100, 1200]   # minimum edge cover (all differ)
  ramp_baseline: [pass, pass, TLE, TLE, TLE]
  baseline_tle_confirmed: true          # exit=124 at 2s on cases 08,09,10
  gen_command: "tools/gen_family_11.py --criterion 2 --uA <k> --uB <k> --mode <hard|star> --seed 1"
  reference_gen_seconds: [{case: "10", uA: 1200, seconds: 0.53}]
  notes: >-
    Kuhn (O(V*E)) TLEs on the staircase from uA=uB~900 while Hopcroft-Karp stays under 0.6s.
    Gap is narrow so s bound raised 2e5 -> 8e5; uA,uB<=1e5 unchanged. Case 06 is a star
    (known edge cover). Answers differ so no constant passes.
