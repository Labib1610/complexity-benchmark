family: "11"
family_name: set_cover
criterion: 2
class: P
problem_letter: B
intended_algorithm: "each 2-skill set is an edge; minimum set cover = minimum edge cover = u - max matching (Gallai); take the matching edges then cover each remaining skill with any incident set; O(E*sqrt V)"
reduction_note: "set cover restricted to 2-element sets is minimum edge cover, polynomial via matching (Gallai's theorem)"
constraint_delta: "same SET COVER decision + witness and I/O as criterion 1; the one switch is that every set has exactly 2 skills (edge cover), making it polynomial"
judge: custom
time_limit_s: 2
memory_limit_mb: 256
# audit B4: this arm now shares the exact task/schema/output of criterion 1.
complexity_switch: "set size only: every set has exactly 2 skills (vs arbitrary size in criterion 1), so set cover becomes edge cover and is polynomial via matching; task (decide a size-k cover + witness), schema (u s k), and output identical"
scaling:
  # REBUILT per audit B4. The old criterion 2 was minimum-edge-cover SIZE with a two-side (uA,uB,s)
  # schema and integer-only output -- a DIFFERENT task and I/O from the decision+witness criterion 1.
  # It is now the SAME set-cover decision + witness with the SAME unified schema (u s k) + sets,
  # restricted to 2-element sets (edge cover, P via Gallai/matching). Ground truth (min cover) is
  # computed by the generator via matching, so k is always correct.
  model_time_limit_s: 2
  chosen_max_size: 100000                # u (skills); reference ~1.1s here vs the 2s limit
  ramp_sizes: [10, 40, 100, 1000, 5000, 20000, 40000, 60000, 80000, 100000]  # u per case 01-10
  ramp_kind:  [yes, no, yes, no, yes, no, yes, no, yes, yes]
  gen_command: "tools/gen_family_11.py --criterion 2 --u <u> --seed <s> --kind <yes|no>"
  p_timing_margin: "Hopcroft-Karp matching + edge-cover witness runs in well under 2s at u=200000 (sparse)"
  notes: >-
    Same set-cover task as criterion 1; the 2-element-set (edge-cover) promise makes it polynomial
    (matching + Gallai). Verified against a brute-force minimum cover on 400 instances across all k.
    A model that recognises the structure and uses matching passes; a general exponential search does
    not scale.
