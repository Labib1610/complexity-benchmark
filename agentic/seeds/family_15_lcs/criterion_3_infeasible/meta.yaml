family: "15"
family_name: lcs
criterion: 3
class: INFEASIBLE
problem_letter: C
intended_algorithm: "intersect the letter sets of all sequences; an empty intersection means no non-empty shared motif exists, so print NONE"
reduction_note: "disjoint alphabets imply LCS length is 0; any shared character would be required"
constraint_delta: "guarantee disjoint alphabets between sequences; output the two alphabet sets"
judge: exact
time_limit_s: 1
memory_limit_mb: 256
scaling:
  # Corrected (file 26/40) rule. The sequences use mutually disjoint alphabets, so no letter is
  # shared and no non-empty motif exists; the reference intersects the letter sets in O(total).
  # The baseline (tools/naive_family_15_criterion_3.py) does NOT intersect and instead runs the
  # memo-less multi-sequence LCS; with disjoint alphabets it never takes a letter and explores
  # the whole interleaving tree (exponential) before concluding length 0 -> TLE.
  model_time_limit_s: 1
  baseline_probe:
    - {k: 2, L: 10, baseline_s: 0.11}   # last under 1s
    - {k: 2, L: 12, baseline_s: 1.30}   # crosses the limit
    - {k: 3, L: 15, baseline_s: ">4"}
  baseline_tle_from_size: 12            # L at k=2 (product k*L drives it)
  chosen_max_size: 20                   # L; baseline is exponential in the total length
  ramp_sizes: [8, 15, 20, 18, 18]       # L per case 03-07
  ramp_specs:
    - {case: "03", k: 2, L: 8}
    - {case: "04", k: 3, L: 15}
    - {case: "05", k: 3, L: 20}
    - {case: "06", k: 4, L: 18}
    - {case: "07", k: 5, L: 18}
  ramp_baseline: [pass, TLE, TLE, TLE, TLE]
  baseline_tle_confirmed: true          # exit=124 at 1s on cases 04,05,06,07
  gen_command: "tools/gen_family_15.py --criterion 3 --k <k> --L <L> --seed 1"
  reference_gen_seconds: [{case: "07", k: 5, L: 18, seconds: 0.01}]
  notes: >-
    O(total) alphabet intersection vs an exponential memo-less LCS attempt. As with every
    INFEASIBLE arm the answer is a constant (NONE), so it passes by design -- the tier shows the
    search route TLEs. Sizes kept modest (the naive is exponential in the total length);
    statement bounds k<=5, L<=2000 unchanged.
