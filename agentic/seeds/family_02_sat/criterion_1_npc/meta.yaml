family: "02"
family_name: sat
criterion: 1
class: NPC
problem_letter: A
intended_algorithm: "DPLL with unit propagation (variable->clause index for efficient BCP); branch on the next unassigned variable and return ANY satisfying assignment, or prove unsatisfiable"
reduction_note: "3-SAT; NP-complete; Cook-Levin"
constraint_delta: "clauses of exactly 3 literals near the m/n ~ 4.26 phase transition (hard SAT/UNSAT)"
judge: custom
time_limit_s: 2
memory_limit_mb: 256
# audit B4: criterion 1 now accepts ANY satisfying assignment (the lexicographically-smallest
# requirement is removed), matching criterion 2's contract -- the audit flagged that A required
# lex-min while B accepted any. The reference is also rewritten from a lex-min DPLL that re-scanned
# every clause each propagation round (TLE 2.004s at n=90) to an efficient any-assignment DPLL with
# variable-indexed unit propagation (0.74s at n=90 UNSAT).
complexity_switch: "clause width: 3 literals (NP-complete) vs 2 literals in criterion 2 (P via SCC); same n m + signed-literal schema and any-assignment output contract"
scaling:
  model_time_limit_s: 2
  # 3-SAT near the phase transition (m ~ 4.26 n). The realistic baseline is index-order backtracking
  # WITHOUT unit propagation, which explodes near the threshold; the reference uses DPLL with BCP.
  chosen_max_size: 90                    # n variables; efficient DPLL solves threshold cases < 1s
  ramp_sizes: [60, 70, 80, 85, 90]       # n per cases 05-09
  ramp_ratio: 4.26                       # m/n at the hard phase transition
  gen_command: "tools/gen_family_02.py --criterion 1 --n <n> --seed <s> --ratio 4.26"
  honest_limitation: >-
    Inherent gradeable-NPC ceiling: a gradeable case must be solvable by the reference within the
    limit, so n is capped where threshold DPLL finishes < ~1s (n <= 90). The tier separates naive
    backtracking (no propagation) from DPLL-with-BCP -- it does not prove hardness against a modern
    CDCL SAT solver, and must not be reported as such.
  notes: >-
    3-SAT at the m/n ~ 4.26 phase transition; mix of SAT and UNSAT. Reference is an efficient DPLL
    that returns any satisfying assignment (or UNSAT). Statement bound n<=90 kept.
