family: "04"
family_name: subset_sum
criterion: 1
class: NPC
problem_letter: A
intended_algorithm: "meet-in-the-middle: enumerate all subset sums of each half (2^(n/2)), hash one half by sum, and for each sum s in the other half look up the complement T - s"
reduction_note: "SUBSET SUM; NP-complete; reduction from 3-SAT via binary encoding"
constraint_delta: "anchor variant with values up to 10^9; rules out pseudo-poly DP"
judge: custom
time_limit_s: 5
memory_limit_mb: 256
scaling:
  # Corrected (file 26/29) rule. Cleanest asymptotic gap in the benchmark: the
  # reference is meet-in-the-middle O(2^(n/2)); the realistic baseline
  # (tools/naive_family_04_criterion_1.py) is recursive include/exclude subset search
  # O(2^n) with the standard "prune when running sum > target". Large values (up to
  # 1e9, T up to 4e10) also block the pseudo-poly DP-over-sums route
  # (tools/naive_family_04_criterion_1_dp.py needs a ~20 GB array -> TLE/OOM).
  model_time_limit_s: 5
  baseline_probe:                       # include/exclude search, worst hard-NO/hard-YES seeds
    - {size: 24, baseline_s: 1.3}       # last size under 5s
    - {size: 26, baseline_s: 5.4}       # crosses the limit (hard NO)
    - {size: 28, baseline_s: 20.0}
    - {size: 30, baseline_s: ">30"}     # hard YES also blows up (unique large-value subset)
  baseline_tle_from_size: 26
  # MEMORY CEILING: the MITM reference stores 2^(n/2) (sum, mask) pairs per half. At
  # n=40 that is 2^20 pairs and peaks over the 256 MB limit (reference_check enforces
  # memory even though .out generation is offline). n=36 (2^18 pairs, ~85 MB) is the
  # largest that validates under 256 MB, so the ramp tops out there. Statement bound
  # n<=40 is kept (truthful problem class); the baseline TLEs far below the ceiling.
  chosen_max_size: 36                   # reference MITM ~0.1s / ~85MB at n=36 (2^18 half-sums)
  ramp_sizes: [20, 24, 28, 32, 36]      # cases 06-10
  ramp_seeds: [1, 1, 1, 3, 1]
  ramp_reach: [yes, no, no, yes, no]    # generator --reach; hard-NO = even values + odd T
  ramp_verdicts: [YES, NO, NO, YES, NO]
  ramp_baseline: [pass, pass, TLE, TLE, TLE]
  baseline_tle_confirmed: true          # exit=124 at 5s on cases 08,09,10
  dp_route_blocked: "naive_family_04_criterion_1_dp.py at n=40 needs bytearray(T=~2e10) ~20GB -> TLE/OOM"
  gen_command: "tools/gen_family_04.py --criterion 1 --n <n> --seed <s> --reach <yes|no>"
  reference_gen_seconds:
    - {case: "06", size: 20, seconds: 0.0}
    - {case: "07", size: 24, seconds: 0.0}
    - {case: "08", size: 28, seconds: 0.0}
    - {case: "09", size: 32, seconds: 0.04}
    - {case: "10", size: 36, seconds: 0.10}
  notes: >-
    Widest gap in the set: 2^(n/2) reference vs 2^n baseline. Case 09 is a HARD YES --
    a unique large-value subset that the naive search TLEs finding while the MITM
    reference locates it instantly; this keeps the tier non-gameable even against a
    "search-with-timeout-fallback-to-NO" heuristic (which would answer NO on 09 and be
    wrong). Both plausible naive routes fail: the 2^n search (cases 08-10) and the
    pseudo-poly DP (blocked by T up to 4e10). Statement bound n<=40 unchanged.
