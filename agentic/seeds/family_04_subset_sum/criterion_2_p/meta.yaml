family: "04"
family_name: subset_sum
criterion: 2
class: P
problem_letter: B
intended_algorithm: "boolean DP over reachable sums dp[j] with 0/1 (downward) update; O(n*T); reconstruct one group via predecessor tracking"
reduction_note: "subset sum with poly-bounded values/target is in P via DP; O(n*T)"
constraint_delta: "values and target bounded by n^2; DP runtime is polynomial in input size"
judge: custom
time_limit_s: 2
memory_limit_mb: 256
scaling:
  # REBUILT per audit B2/B6. Same task and I/O schema as criterion 1; the ONE documented switch
  # is value magnitude (costs<=100, T<=500), which makes the O(n*T) boolean-sum DP polynomial.
  model_time_limit_s: 2
  #
  # AUDIT FIX (B2/B6): the old NO instances used "small even values + odd target" (parity-
  # trivial). NO instances are now GENUINE: random coprime small values with the target verified
  # unreachable by the exact DP. Genuine small-value NO only exists at small n (with many items
  # every target <=500 becomes reachable), so NO cases sit at n<=12; large n (up to 1000)
  # demonstrates that the DP stays polynomial via YES cases. Distinct seeds per case (no dupes).
  chosen_max_size: 1000                  # reference DP ~0.02s at n=1000 (n*T = 5e5)
  ramp_sizes: [8, 10, 12, 50, 100, 200, 400, 600, 800, 1000]  # cases 01-10
  ramp_kind:  [no, no, no, yes, yes, yes, yes, yes, yes, yes]
  ramp_verdicts: [NO, NO, NO, YES, YES, YES, YES, YES, YES, YES]
  ramp_baseline_note: "the O(2^n) subset search TLEs from n~25; the DP is instant to n=1000"
  gen_command: "tools/gen_family_04.py --criterion 2 --n <n> --seed <s> --kind <yes|no>"
  p_timing_margin: "reference DP runs in ~0.02s at n=1000 vs the 2s limit -- a >90x margin (gate 12)"
  notes: >-
    O(n*T) DP is comfortable to n=1000 while a 2^n subset search TLEs from n~25; the
    discriminator is purely exponential-vs-polynomial. NO cases are now genuine (coprime,
    DP-verified), removing the old parity shortcut. Statement bound n<=1000 unchanged.
