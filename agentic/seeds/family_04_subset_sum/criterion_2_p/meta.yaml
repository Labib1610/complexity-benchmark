family: "04"
family_name: subset_sum
criterion: 2
class: P
problem_letter: B
intended_algorithm: "boolean DP over reachable sums dp[j] with 0/1 (downward) update; O(n*T); reconstruct one group via predecessor tracking"
reduction_note: "subset sum with poly-bounded values/target is in P via DP; O(n*T)"
constraint_delta: "values and target bounded by n^2; DP runtime is polynomial in input size"
judge: custom
time_limit_s: 2
memory_limit_mb: 256
scaling:
  # Corrected (file 26/29) rule. Real asymptotic gap: with small values/target the
  # reference DP over reachable sums is O(n*T) (T<=500) -- polynomial. The realistic
  # baseline (tools/naive_family_04_criterion_2.py) is include/exclude subset search.
  # NO instances use SMALL even values (in [2,8]) with an ODD target, so the
  # "sum > T" pruning is useless (many items fit under T) and the search still
  # explores exponentially, while the DP stays instant.
  model_time_limit_s: 2
  baseline_probe:                       # subset search on small-value NO instances
    - {size: 18, baseline_s: 0.04}
    - {size: 22, baseline_s: 0.33}      # last size under 2s
    - {size: 26, baseline_s: 7.6}       # crosses the limit
    - {size: 30, baseline_s: ">8"}
  baseline_tle_from_size: 25
  chosen_max_size: 1000                 # reference DP ~0.02s at n=1000 (n*T = 5e5)
  ramp_sizes: [15, 22, 100, 500, 1000]  # cases 06-10
  ramp_seeds: [1, 1, 1, 1, 1]
  ramp_reach: [yes, no, no, no, no]     # NO = small even values + odd target
  ramp_verdicts: [YES, NO, NO, NO, NO]
  ramp_baseline: [pass, pass, TLE, TLE, TLE]
  baseline_tle_confirmed: true          # exit=124 at 2s on cases 08,09,10
  gen_command: "tools/gen_family_04.py --criterion 2 --n <n> --seed 1 --reach <yes|no>"
  reference_gen_seconds:                # all instant (n*T <= 5e5)
    - {case: "06", size: 15,   seconds: 0.0}
    - {case: "07", size: 22,   seconds: 0.0}
    - {case: "08", size: 100,  seconds: 0.0}
    - {case: "09", size: 500,  seconds: 0.0}
    - {case: "10", size: 1000, seconds: 0.0}
  notes: >-
    O(n*T) DP is comfortable to n=1000 while a 2^n subset search TLEs from n~25. The
    NO instances deliberately use small values so the sum-prune cannot rescue the
    search. Statement bound n<=1000 unchanged. NOTE: no hard-YES case exists (dense
    small-value YES instances are easy for the search), so like other P/NPC search
    arms the tier is non-gameable by constants (the YES case needs a real subset) but
    a "search-with-timeout-fallback-to-NO" heuristic would pass; deferred to the
    agentic phase. n*T<=5e5 is trivial for any DP, so a "poor-constants DP" cannot be
    made to strain at these bounds -- the discriminator is purely 2^n vs polynomial.
