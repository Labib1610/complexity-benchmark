family: "04"
family_name: subset_sum
criterion: 3
class: INFEASIBLE
problem_letter: C
intended_algorithm: "all item costs are positive so any group totals >= 0; a negative target is unreachable, so print NO"
reduction_note: "negative target is trivially infeasible since all item values are positive"
constraint_delta: "target is guaranteed negative; immediate infeasibility certificate"
judge: exact
time_limit_s: 1
memory_limit_mb: 256
scaling:
  # Corrected (file 26/29) rule. The target is negative and all costs are positive,
  # so the answer is trivially NO (reference is an O(1) arithmetic check). The
  # realistic baseline (tools/naive_family_04_criterion_3.py) does NOT notice this and
  # enumerates subsets, O(2^n) -> TLEs at large n.
  model_time_limit_s: 1
  baseline_probe:                       # 2^n enumeration on negative-target instances
    - {size: 18, baseline_s: 0.03}
    - {size: 22, baseline_s: 0.39}      # last size under 1s
    - {size: 26, baseline_s: 6.35}      # crosses the limit
    - {size: 30, baseline_s: ">10"}
  baseline_tle_from_size: 25
  chosen_max_size: 1000
  ramp_sizes: [22, 100, 300, 600, 1000] # cases 03-07
  ramp_seeds: [1, 1, 1, 1, 1]
  ramp_verdicts: [NO, NO, NO, NO, NO]   # negative target -> always infeasible
  ramp_baseline: [pass, TLE, TLE, TLE, TLE]
  baseline_tle_confirmed: true          # exit=124 at 1s on cases 04,05,06,07
  gen_command: "tools/gen_family_04.py --criterion 3 --n <n> --seed 1"
  reference_gen_seconds:                # all instant (O(1) check)
    - {case: "03", size: 22,   seconds: 0.0}
    - {case: "04", size: 100,  seconds: 0.0}
    - {case: "05", size: 300,  seconds: 0.0}
    - {case: "06", size: 600,  seconds: 0.0}
    - {case: "07", size: 1000, seconds: 0.0}
  notes: >-
    A solution that searches subsets before noticing the negative target TLEs from
    n~25; the arithmetic check is O(1). Statement bound n<=1000 unchanged. As with
    every INFEASIBLE arm the answer is a constant (NO), so print("NO") passes by
    design -- the tier demonstrates that the naive search route TLEs, not output
    diversity.
