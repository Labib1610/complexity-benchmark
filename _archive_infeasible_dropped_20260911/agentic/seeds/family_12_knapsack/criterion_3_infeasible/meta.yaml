family: "12"
family_name: knapsack
criterion: 3
class: INFEASIBLE
problem_letter: C
intended_algorithm: "every cost exceeds the budget, so nothing is affordable; output MIN m with B < m <= every cost (e.g. m = the minimum cost) as a checkable certificate"
reduction_note: "co-NP style impossibility certification; infeasible because the affordable set is empty (min cost > B)"
constraint_delta: "the one documented switch vs A/B: this arm keeps the (n, B, cost/value) input schema but asks for a checkable INFEASIBILITY CERTIFICATE rather than an optimal selection"
judge: custom
time_limit_s: 2
memory_limit_mb: 256
# audit B4: complexity_switch records the single intended difference from the A/B pair.
complexity_switch: "output contract = infeasibility certificate (diagnosis) instead of optimal value + witness; input schema unchanged"
scaling:
  # REBUILT per audit B5. The previous design used budget B=0 and required a constant "NO", so
  # print("NO") passed by construction (gameable). This redesign is an infeasibility-CERTIFICATE
  # task: every cost strictly exceeds B (nothing affordable), and the model must output `MIN m` with
  # B < m <= every cost. A constant cannot pass because m is instance-specific and checked.
  #
  # DIAGNOSIS tier (correctness, not speed). Unlike partition, knapsack affordability-infeasibility
  # admits essentially ONE cheap certificate (the cheapest item exceeds the budget); the tier is
  # kept non-gameable by requiring the instance-specific bound m, verified against the input.
  mechanisms: [MIN]
  gen_command: "tools/gen_family_12.py --criterion 3 --n <n> --seed <s>"
  cases:                                 # distinct seeds -> no duplicate inputs (B6)
    - {case: "01", n: 3,   cert: "MIN m"}
    - {case: "02", n: 3,   cert: "MIN m"}
    - {case: "03", n: 20,  cert: "MIN m"}
    - {case: "04", n: 100, cert: "MIN m"}
    - {case: "05", n: 1000, cert: "MIN m"}
    - {case: "06", n: 5000, cert: "MIN m"}
    - {case: "07", n: 20000, cert: "MIN m"}
  constant_output_fails: true            # audit B5 / release_check G7: `NO` (or any constant) fails
  notes: >-
    Every instance is genuinely infeasible (min cost > B) and carries a `MIN m` certificate the
    validator checks directly against the input (B < m <= every cost). A constant program fails.
    Statement bound n<=100000. Verified by validator.py, not by literal comparison.
