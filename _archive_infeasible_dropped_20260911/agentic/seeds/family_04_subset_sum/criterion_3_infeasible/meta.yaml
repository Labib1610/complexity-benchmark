family: "04"
family_name: subset_sum
criterion: 3
class: INFEASIBLE
problem_letter: C
intended_algorithm: "certify impossibility: if T exceeds the total of all costs print SUM; else output g=gcd(costs)>=2 with g not dividing T as MOD g"
reduction_note: "co-NP style impossibility certification; every instance is infeasible for a machine-checkable reason (range or modular obstruction)"
constraint_delta: "the one documented switch vs A/B: this arm keeps the (n, costs, T) input schema but asks for a checkable INFEASIBILITY CERTIFICATE rather than a YES/NO decision + witness"
judge: custom
time_limit_s: 2
memory_limit_mb: 256
# audit B4: complexity_switch records the single intended difference from the A/B pair.
complexity_switch: "output contract = infeasibility certificate (diagnosis) instead of decide+witness; input schema unchanged"
scaling:
  # REBUILT per audit B5. The previous design made every instance infeasible via a negative
  # target and required a constant "NO", so print("NO") passed by construction (gameable). This
  # redesign is an infeasibility-CERTIFICATE task: a constant output cannot pass, and MULTIPLE
  # mechanisms (out-of-range total; modular obstruction with several divisors) are mixed so a
  # solver that knows only one mechanism fails part of the suite.
  #
  # This is a DIAGNOSIS tier, not a runtime tier: correctness (finding the right certificate),
  # not speed, is what is measured. There is no "naive TLEs" calibration here -- that framing
  # was part of what the audit rejected about the old INFEASIBLE arms.
  mechanisms: [SUM, MOD]
  mod_divisors_used: [2, 3, 5, 7, 11, 13]
  gen_command: "tools/gen_family_04.py --criterion 3 --n <n> --seed <s> --kind <sum|mod>"
  cases:                                 # distinct seeds/kinds -> no duplicate inputs (B6)
    - {case: "01", n: 3,  kind: mod, cert: "MOD 2"}   # example 1 in the statement
    - {case: "02", n: 3,  kind: sum, cert: "SUM"}     # example 2 in the statement
    - {case: "03", n: 20, kind: sum, cert: "SUM"}
    - {case: "04", n: 20, kind: mod, cert: "MOD d"}
    - {case: "05", n: 40, kind: sum, cert: "SUM"}
    - {case: "06", n: 40, kind: mod, cert: "MOD d"}
    - {case: "07", n: 60, kind: mod, cert: "MOD d"}
    - {case: "08", n: 60, kind: sum, cert: "SUM"}
  constant_output_fails: true            # audit B5 / release_check G7: `NO` (or any constant) fails
  notes: >-
    Every instance is genuinely infeasible and carries a certificate the validator checks
    directly against the input: SUM requires T > sum(costs); MOD d requires d>=2 to divide every
    cost but not T. A constant program, and a program that only ever prints one mechanism, both
    fail. Statement bound n<=60. Certificates verified by validator.py, not by literal comparison.
