family: "05"
family_name: three_dim_matching
criterion: 3
class: INFEASIBLE
problem_letter: C
intended_algorithm: "scan specialists 1..k; report the smallest that appears in no allowed triple (it can never be covered)"
reduction_note: "Hall's theorem: element with no compatible triple makes perfect matching impossible"
constraint_delta: "guarantee one element has no compatible triple; output the element id"
judge: custom
time_limit_s: 1
memory_limit_mb: 256
# audit B4: unified on the 3DM triple schema (was bipartite pairs).
complexity_switch: "output contract = infeasibility certificate (the uncoverable specialist) instead of a full plan; same triple schema as criterion 1."
scaling:
  # Corrected (file 26/30) rule. The reference scans compatibility rows in O(E) and
  # prints the smallest worker with no allowed task. The realistic baseline
  # (tools/naive_family_05_criterion_3.py) does NOT notice the empty row and tries to
  # build a full assignment by backtracking; when the partnerless worker sits at a HIGH
  # index the search assigns the earlier workers in exponentially many ways before
  # hitting the dead end, so it TLEs. (A polynomial Kuhn attempt is too fast here -- it
  # short-circuits on the empty row -- so the realistic naive is the exponential one.)
  model_time_limit_s: 1
  baseline_probe:                       # backtracking assignment, high-index empty
    - {k: 8,  baseline_s: 0.01}
    - {k: 10, baseline_s: 0.63}         # last size under 1s
    - {k: 12, baseline_s: ">3"}         # crosses the limit
    - {k: 50, baseline_s: ">3"}
  baseline_tle_from_size: 12
  chosen_max_size: 1000
  ramp_sizes: [10, 50, 200, 500, 1000]  # cases 03-07
  ramp_empty_at: [10, 50, 200, 500, 1000]   # partnerless worker at the HIGH index
  ramp_answers: [10, 50, 200, 500, 1000]     # smallest (here only) empty worker
  ramp_baseline: [pass, TLE, TLE, TLE, TLE]
  baseline_tle_confirmed: true          # exit=124 at 1s on cases 04,05,06,07
  gen_command: "tools/gen_family_05.py --criterion 3 --k <k> --e <e> --seed 1 --empty high"
  reference_gen_seconds:                # O(E) scan, all instant
    - {case: "03", k: 10,   seconds: 0.0}
    - {case: "07", k: 1000, seconds: 0.0}
  notes: >-
    The empty compatibility row makes the answer a single worker id, found in O(E). A
    solution that instead searches for a full assignment (exponential backtracking)
    TLEs from k~12; the partnerless worker is placed at the HIGH index so the search
    explores the earlier workers before failing. Answers differ across cases, so no
    constant worker id passes the tier. Statement bound k<=1000 unchanged.
