family: "01"
family_name: graph_coloring
criterion: 3
class: INFEASIBLE
problem_letter: C
intended_algorithm: "bitset adjacency; iterate a asc, neighbor b>a asc, c=lowest set bit of adj[a]&adj[b], c>b; O(n*m/64)"
reduction_note: "triangle (K3) is 3-chromatic; its presence makes 2-coloring impossible; certificate-style infeasibility"
constraint_delta: "guarantee a triangle exists; task becomes 'prove no 2-coloring'"
judge: exact
time_limit_s: 2
memory_limit_mb: 256
scaling:
  ceiling_probe:
    - {size: 500, reference_s: 0.052}
    - {size: 1000, reference_s: 0.104}
    - {size: 1500, reference_s: 0.143}
    - {size: 2000, reference_s: 0.198}
  chosen_max_size: 2000
  ramp_sizes: [200, 500, 1000, 1500, 2000]   # cases 05-09
  ramp_notes: "cases 07 (n=1000) and 09 (n=2000) plant the unique triangle at high indices to test the lexicographically-smallest tie-break"
  naive_tle_confirmed: true
  naive_time_at_max: ">6s killed (tools/naive_family_01_criterion_3.py, full O(n^3) triple loop; limit 2s)"
  notes: >-
    INFEASIBLE arm. Reference bitset triangle search runs in 0.20s at n=2000, m=2e5.
    A naive O(n^3) triple loop TLEs decisively. Base graph is bipartite (triangle-
    free) with an isolated planted trio, so the planted triangle is the unique and
    therefore lexicographically-smallest one. m capped at min(n(n-1)/2, 2e5).
