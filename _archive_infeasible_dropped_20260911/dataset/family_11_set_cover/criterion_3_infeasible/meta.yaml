family: "11"
family_name: set_cover
criterion: 3
class: INFEASIBLE
problem_letter: C
intended_algorithm: "mark every skill that appears in some consultant; print the smallest skill id that appears in none (certifies infeasibility)"
reduction_note: "element appearing in no set cannot be covered regardless of set selection"
constraint_delta: "guarantee uncoverable element exists; output the element id"
judge: exact
time_limit_s: 1
memory_limit_mb: 256
scaling:
  # Corrected (file 26/36) rule. One required skill is in no consultant, so it can never be
  # covered; the reference scans in O(total set size) and prints the smallest such skill. The
  # baseline (tools/naive_family_11_criterion_3.py) does NOT scan and instead searches for a
  # full cover by increasing selection size (C(s,size)); since a full cover is impossible it
  # explores exponentially and TLEs.
  model_time_limit_s: 1
  baseline_probe:
    - {u: 10, s: 15,     baseline_s: 0.02}   # pass
    - {u: 18, s: 30,     baseline_s: ">4"}   # crosses the limit
    - {u: 100000, s: 100000, baseline_s: ">4"}
  baseline_tle_from_size: 25            # s
  chosen_max_size: 100000
  ramp_sizes: [15, 100, 2000, 20000, 100000]   # s per case 03-07
  ramp_specs:
    - {case: "03", u: 10,     s: 15}
    - {case: "04", u: 40,     s: 100}
    - {case: "05", u: 1000,   s: 2000}
    - {case: "06", u: 10000,  s: 20000}
    - {case: "07", u: 100000, s: 100000}
  ramp_answers: [10, 40, 1000, 10000, 100000]   # missing skill at the HIGH id (all differ)
  ramp_baseline: [pass, TLE, TLE, TLE, TLE]
  baseline_tle_confirmed: true          # exit=124 at 1s on cases 04,05,06,07
  gen_command: "tools/gen_family_11.py --criterion 3 --u <u> --s <s> --seed 1 --at high"
  reference_gen_seconds: [{case: "07", u: 100000, seconds: 0.04}]
  notes: >-
    O(total) scan vs an exponential cover search. The uncoverable skill is at the HIGH id
    (a scan-from-1 must reach it); answers differ across cases so no constant passes. The
    baseline TLEs from s~25 (it never finds a full cover, so it exhausts every size).
    Statement bounds u<=2e5, s<=2e5 unchanged.
