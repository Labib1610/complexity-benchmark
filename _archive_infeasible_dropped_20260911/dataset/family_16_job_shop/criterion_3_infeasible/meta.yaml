family: "16"
family_name: job_shop
criterion: 3
class: INFEASIBLE
problem_letter: C
intended_algorithm: "certify the deadline is impossible: if some job's p1+p2 > T print JOB i; else if a machine's total load exceeds T print LOAD c"
reduction_note: "co-NP style impossibility certification; the deadline is unmeetable because a single job's sequential work, or a machine's serial load, exceeds T"
constraint_delta: "the one documented switch vs A/B: keeps the two-machine (j, T, p1/p2) schema but asks for a checkable INFEASIBILITY CERTIFICATE instead of a YES/NO deadline decision"
judge: custom
time_limit_s: 2
memory_limit_mb: 256
# audit B4: complexity_switch records the single intended difference from the (flow-shop) B arm.
complexity_switch: "output contract = infeasibility certificate (diagnosis) instead of a YES/NO deadline decision; input schema unchanged (adds the deadline T that the infeasibility is defined against)"
scaling:
  # REBUILT per audit B5. The previous design guaranteed T < some job's machine-1 time and required
  # a constant "NO", so print("NO") passed by construction (gameable). This redesign is an
  # infeasibility-CERTIFICATE task with TWO mechanisms (JOB: a single job's sequential work > T;
  # LOAD: a machine's total serial load > T). A constant output cannot pass, and a solver that knows
  # only one mechanism fails part of the suite; the identifying index is instance-specific.
  #
  # DIAGNOSIS tier (correctness, not speed).
  mechanisms: [JOB, LOAD]
  gen_command: "tools/gen_family_16.py --criterion 3 --j <j> --seed <s> --kind <job|load1|load2>"
  cases:                                 # distinct seeds/kinds -> no duplicate inputs (B6)
    - {case: "01", j: 3,     kind: job,   cert: "JOB i"}    # example 1
    - {case: "02", j: 4,     kind: load1, cert: "LOAD 1"}   # example 2
    - {case: "03", j: 10,    kind: job,   cert: "JOB i"}
    - {case: "04", j: 50,    kind: load1, cert: "LOAD 1"}
    - {case: "05", j: 200,   kind: load2, cert: "LOAD 2"}
    - {case: "06", j: 2000,  kind: job,   cert: "JOB i"}
    - {case: "07", j: 50000, kind: load1, cert: "LOAD 1"}
  constant_output_fails: true            # audit B5 / release_check G7: `NO` (or any constant) fails
  notes: >-
    Every instance is genuinely infeasible and carries a certificate the validator checks against the
    input: JOB i (job i's p1+p2 > T) or LOAD c (machine c total load > T). A constant program, and one
    that only ever prints one mechanism, both fail. Verified by validator.py.
