family: "09"
family_name: clique_independent_set
criterion: 3
class: INFEASIBLE
problem_letter: C
intended_algorithm: "certify impossibility: if k > n print SIZE; else if the graph is complete (m == n(n-1)/2) print COMPLETE (max independent set is 1 < k)"
reduction_note: "co-NP style impossibility certification; infeasible because k exceeds n, or the graph is complete so the max independent set is 1"
constraint_delta: "the one documented switch vs A/B: this arm keeps the (n, m, k) input schema but asks for a checkable INFEASIBILITY CERTIFICATE rather than a YES/NO decision + witness"
judge: custom
time_limit_s: 2
memory_limit_mb: 256
# audit B4: complexity_switch records the single intended difference from the A/B pair.
complexity_switch: "output contract = infeasibility certificate (diagnosis) instead of decide+witness; input schema unchanged"
scaling:
  # REBUILT per audit B5. The previous design asked for a clique of size r > n and required a
  # constant "NO", so print("NO") passed by construction (gameable). This redesign is an
  # infeasibility-CERTIFICATE task with TWO mechanisms (SIZE: k>n; COMPLETE: the graph is complete so
  # max IS = 1 < k). A constant output cannot pass, and a solver that knows only one mechanism fails
  # part of the suite.
  #
  # DIAGNOSIS tier (correctness, not speed).
  mechanisms: [SIZE, COMPLETE]
  gen_command: "tools/gen_family_09.py --criterion 3 --n <n> --seed <s> --kind <size|complete>"
  cases:                                 # distinct seeds/kinds -> no duplicate inputs (B6)
    - {case: "01", n: 3,  kind: size,     cert: "SIZE"}      # example 1
    - {case: "02", n: 3,  kind: complete, cert: "COMPLETE"}  # example 2
    - {case: "03", n: 20, kind: size,     cert: "SIZE"}
    - {case: "04", n: 20, kind: complete, cert: "COMPLETE"}
    - {case: "05", n: 60, kind: size,     cert: "SIZE"}
    - {case: "06", n: 60, kind: complete, cert: "COMPLETE"}
    - {case: "07", n: 150, kind: size,    cert: "SIZE"}
    - {case: "08", n: 150, kind: complete, cert: "COMPLETE"}
  constant_output_fails: true            # audit B5 / release_check G7: `NO` (or any constant) fails
  notes: >-
    Every instance is genuinely infeasible and carries a certificate the validator checks against the
    input: SIZE (k > n) or COMPLETE (m == n(n-1)/2 and k >= 2). A constant program, and one that only
    ever prints one mechanism, both fail. Certificates verified by validator.py.
