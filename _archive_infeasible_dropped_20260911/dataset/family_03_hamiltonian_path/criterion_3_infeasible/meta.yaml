family: "03"
family_name: hamiltonian_path
criterion: 3
class: INFEASIBLE
problem_letter: C
intended_algorithm: "count degree of each vertex from edge list; output the smallest vertex index with degree 0; O(n+m)"
reduction_note: "isolated vertex cannot appear on any Hamiltonian path; immediate certificate"
constraint_delta: "guarantee isolated vertex exists; output the vertex id"
judge: exact
time_limit_s: 1
memory_limit_mb: 256
scaling:
  # Corrected (file 26/28) rule. Asymptotic gap: reference scans degrees O(n+m) and
  # prints the smallest isolated vertex; the realistic baseline
  # (tools/naive_family_03_criterion_3.py) does NOT spot the shortcut and instead
  # searches for a Hamiltonian path first (exhaustive iterative DFS) before falling
  # back to the degree scan -- exponential, so it TLEs at any non-trivial size.
  model_time_limit_s: 1
  baseline_probe:                       # Ham-search baseline; TLEs almost immediately
    - {size: 100,  baseline_s: ">10"}   # already over the 1s limit
    - {size: 1000, baseline_s: ">10"}
  baseline_tle_from_size: 100
  chosen_max_size: 200000               # reference O(n+m) ~0.1s at n=2e5
  ramp_sizes: [1000, 10000, 50000, 100000, 200000]   # cases 04-08
  ramp_seeds: [1, 1, 1, 1, 1]
  ramp_iso: [high, low, high, "high+iso2=7", high]   # isolated-vertex placement
  ramp_answers: [1000, 1, 50000, 7, 200000]          # smallest isolated index
  ramp_baseline: [TLE, TLE, TLE, TLE, TLE]
  baseline_tle_confirmed: true          # exit=124 at 1s on all scaled cases
  gen_command: "tools/gen_family_03.py --criterion 3 --n <n> --m 2n --seed 1 --iso <high|low> [--iso2 7]"
  # Case 07 plants TWO isolated vertices {7, 100000}: the answer is the SMALLEST (7),
  # so a solution that reports a non-smallest isolated vertex fails. Cases with iso at
  # the high index (04,06,08) require scanning to the end. Answers all differ, so no
  # constant vertex id passes the tier.
  reference_gen_seconds:
    - {case: "04", size: 1000,   seconds: 0.0}
    - {case: "05", size: 10000,  seconds: 0.0}
    - {case: "06", size: 50000,  seconds: 0.03}
    - {case: "07", size: 100000, seconds: 0.06}
    - {case: "08", size: 200000, seconds: 0.11}
  notes: >-
    A solution that tries to actually decide the route (search for a Hamiltonian path)
    before noticing the cut-off vertex TLEs at every scaled size; the O(n+m) degree
    scan is instant. Statement bound already n<=2e5 (unchanged). The anchors 01-03
    (small) are the pass cases; the naive baseline TLEs on all appended cases 04-08.
