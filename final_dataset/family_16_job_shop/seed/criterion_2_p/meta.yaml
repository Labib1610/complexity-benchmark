family: "16"
family_name: job_shop
criterion: 2
class: P
problem_letter: B
intended_algorithm: "Johnson's rule for the two-machine flow-shop: jobs with p1<=p2 first ascending by p1, then the rest descending by p2, then simulate the pipeline for the makespan; O(j log j)"
reduction_note: "2-machine flow-shop is optimally solvable by Johnson's algorithm in O(n log n)"
constraint_delta: "exactly 2 machines; Johnson's algorithm gives optimal makespan schedule"
judge: exact
time_limit_s: 1
memory_limit_mb: 256
scaling:
  # Corrected (file 26/41) rule. HUGE clean gap: the reference is Johnson's rule O(j log j); the
  # baseline (tools/naive_family_16_criterion_2.py) tries ALL j! orderings (exact but factorial),
  # dead by j~11. Both give the optimal makespan on the small instance the naive finishes.
  model_time_limit_s: 1
  baseline_probe:                       # j! search vs Johnson's rule
    - {j: 8,     order: sorted, baseline_s: 0.02}   # pass (8! = 40320)
    - {j: 1000,  order: random, baseline_s: ">1"}   # TLE (cannot enumerate)
    - {j: 200000, order: random, baseline_s: ">1"}
  baseline_tle_from_size: 11            # j (factorial explodes)
  chosen_max_size: 200000
  ramp_sizes: [8, 1000, 10000, 100000, 200000]   # j per case 06-10
  ramp_specs:
    - {case: "06", j: 8,      order: sorted}    # pass
    - {case: "07", j: 1000,   order: random}
    - {case: "08", j: 10000,  order: sorted}    # already-sorted input
    - {case: "09", j: 100000, order: reverse}   # reverse-sorted input
    - {case: "10", j: 200000, order: random}
  ramp_baseline: [pass, TLE, TLE, TLE, TLE]
  baseline_tle_confirmed: true          # exit=124 at 1s on cases 07,08,09,10
  gen_command: "tools/gen_family_16.py --criterion 2 --j <j> --seed 1 --order <sorted|reverse|random>"
  reference_gen_seconds: [{case: "10", j: 200000, seconds: 0.18}]
  notes: >-
    O(j log j) Johnson's rule vs O(j!) ordering search. The naive dies by j~11; the reference is
    instant to j=2e5. Includes already-sorted (08), reverse (09) and random (07,10) inputs.
    Answers differ so no constant passes. Statement bound j<=2e5 unchanged.
