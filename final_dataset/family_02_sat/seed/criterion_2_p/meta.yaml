family: "02"
family_name: sat
criterion: 2
class: P
problem_letter: B
intended_algorithm: "implication graph + Kosaraju SCC; O(n+m); satisfiable iff no variable shares SCC with its negation"
reduction_note: "2-SAT is solvable in O(n+m) via SCC on implication graph"
constraint_delta: "clauses reduced to 2 literals; removes NP-hardness entirely"
judge: custom
time_limit_s: 1
memory_limit_mb: 256
scaling:
  # Realistic baseline = correct O(n*m) greedy 2-SAT (assign in order, propagate
  # units by re-scanning all clauses to a fixpoint). Reference is O(n+m) SCC.
  baseline_probe:
    - {size: 1000,  baseline_s: 0.14}    # passes
    - {size: 3000,  baseline_s: 1.01}    # crosses the 1s limit
    - {size: 5000,  baseline_s: 3.0}     # TLE
    - {size: 10000, baseline_s: 11.0}    # TLE
    - {size: 50000, baseline_s: ">12"}
  model_time_limit_s: 1
  baseline_tle_from_size: 3000
  chosen_max_size: 100000
  ramp_sizes: [1000, 10000, 5000, 50000, 100000]   # cases 05-09
  ramp_notes: >-
    05 n=1000 SAT (pass); 06 n=10000 UNSAT (naive short-circuits on the
    contradiction gadget -> pass, serves as the large-unsatisfiable case);
    07 n=5000 SAT (TLE); 08 n=50000 SAT with 1000 components (TLE);
    09 n=100000 SAT (TLE). The naive TLEs on satisfiable instances (needs a full
    assignment) but passes gadget-UNSAT quickly -- an informative asymmetry.
  baseline_tle_confirmed: true          # exit 124 at 1s on cases 07,08,09
  reference_gen_seconds_at_max: "<0.3"  # SCC O(n+m); ground-truth generation is instant
  notes: "P arm, genuine asymptotic gap (O(n+m) SCC vs O(n*m) greedy). m capped at 2e5."
