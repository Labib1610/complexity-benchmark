family: "10"
family_name: dominating_set
criterion: 2
class: P
problem_letter: B
intended_algorithm: "iterative post-order tree DP with three states per node (has sensor / covered by a child / not yet covered); answer = min(root has-sensor, root covered-by-child); O(n)"
reduction_note: "dominating set on trees is solvable in O(n) via tree DP"
constraint_delta: "graph restricted to a tree; tree DP gives optimal dominating set in linear time"
judge: exact
time_limit_s: 1
memory_limit_mb: 256
scaling:
  # Corrected (file 26/35) rule. HUGE gap: the reference is an O(n) ITERATIVE post-order
  # tree DP (3 states per node); the baseline (tools/naive_family_10_criterion_2.py)
  # does not recognise the tree structure and searches for the minimum dominating set by
  # trying subsets of increasing size (C(n,size)), which never gets past size ~3 on any
  # tree whose min dominating set exceeds a handful, so it TLEs. This arm directly tests
  # whether the model RECOGNISES the tractable structure -- the paper's thesis.
  model_time_limit_s: 1
  baseline_probe:                       # increasing-size subset search, by tree shape
    - {n: 100000, shape: star,     min_dom_set: 1,     baseline_s: 0.07}   # pass (minDS=1)
    - {n: 1000,   shape: path,     min_dom_set: 334,   baseline_s: ">4"}
    - {n: 10000,  shape: balanced, min_dom_set: 2859,  baseline_s: ">4"}
    - {n: 100000, shape: random,   min_dom_set: 37447, baseline_s: ">4"}
  baseline_tle_from_size: 30            # any tree with min dominating set > ~3
  chosen_max_size: 200000
  ramp_sizes: [100000, 1000, 10000, 100000, 200000]   # n per case 06-10
  ramp_shapes: [star, path, balanced, random, path]
  ramp_answers: [1, 334, 2859, 37447, 66667]           # min dominating set (all differ)
  ramp_baseline: [pass, TLE, TLE, TLE, TLE]
  baseline_tle_confirmed: true          # exit=124 at 1s on cases 07,08,09,10
  gen_command: "tools/gen_family_10.py --criterion 2 --n <n> --seed 1 --shape <star|path|balanced|random>"
  reference_gen_seconds: [{case: "10", n: 200000, seconds: 0.24}]
  # SECOND FAILURE MODE (documented, not the ramp baseline): a model that DOES recognise
  # the tree DP but writes it RECURSIVELY (tools/naive_family_10_criterion_2_recursive.py)
  # gives the right answer on shallow trees (star, balanced) but dies with a RecursionError
  # on the deep PATH cases (07, 10; n=1e3 and 2e5). The reference avoids this with an
  # explicit post-order stack. Verified: recursive path n=2e5 -> RecursionError (rc=1);
  # iterative reference on the same input -> 66667 in 0.24s.
  notes: >-
    O(n) iterative tree DP vs exponential subset search. The star (case 06) has min
    dominating set 1 so the subset search finds it immediately (pass); paths, balanced and
    random trees have large min dominating sets so it TLEs. Statement bound n<=2e5 unchanged.
    NOTE the recursion-depth failure: a RECURSIVE tree DP RuntimeErrors on the path cases
    (a realistic, distinct model failure) while the iterative reference handles them.
