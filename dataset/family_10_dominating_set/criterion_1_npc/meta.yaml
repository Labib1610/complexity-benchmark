family: "10"
family_name: dominating_set
criterion: 1
class: NPC
problem_letter: A
intended_algorithm: "set-cover-style branch and bound over closed-neighborhood bitsets: branch on the lowest uncovered vertex u, trying each vertex in N[u] as a sensor, bounded by budget k"
reduction_note: "DOMINATING SET; NP-complete; reduction from SET COVER and VERTEX COVER"
constraint_delta: "anchor variant (NP-complete base)"
judge: custom
time_limit_s: 5
memory_limit_mb: 256
scaling:
  # Corrected (file 26/35) rule. Asymptotic gap: the reference is a set-cover-style
  # branch-and-bound over closed-neighbourhood bitsets; the baseline
  # (tools/naive_family_10_criterion_1.py) tries all C(n,k) subsets. Disjoint P3 paths
  # (leaf-center-leaf) each have a UNIQUE minimum dominating set of size 1 (the center),
  # so t P3s have a unique minimum dominating set of size t (the centers), placed at the
  # HIGHEST indices so the C(n,k) enumeration reaches the one good set last.
  model_time_limit_s: 5
  baseline_probe:
    - {k: 8,  n: 24, dominatable: true,  baseline_s: 0.16, reference_s: 0.01}   # last under 5s
    - {k: 8,  n: 27, dominatable: false, baseline_s: 0.53, reference_s: 0.01}
    - {k: 11, n: 36, dominatable: false, baseline_s: ">8", reference_s: 0.01}   # crosses limit
    - {k: 13, n: 39, dominatable: true,  baseline_s: ">8", reference_s: 0.01}
  baseline_tle_from_size: 11            # k (n = 3k or 3(k+1))
  chosen_max_size: 15                   # k; reference B&B stays ~0.01s
  ramp_sizes: [24, 27, 36, 39, 48]      # n per case 06-10
  ramp_specs:
    - {case: "06", k: 8,  dominatable: true,  verdict: YES}
    - {case: "07", k: 8,  dominatable: false, verdict: NO}
    - {case: "08", k: 11, dominatable: false, verdict: NO}
    - {case: "09", k: 13, dominatable: true,  verdict: YES}   # HARD YES
    - {case: "10", k: 15, dominatable: false, verdict: NO}
  ramp_verdicts: [YES, NO, NO, YES, NO]
  ramp_baseline: [pass, pass, TLE, TLE, TLE]
  baseline_tle_confirmed: true          # exit=124 at 5s on cases 08,09,10
  gen_command: "tools/gen_family_10.py --criterion 1 --k <k> --seed 1 --dominatable <yes|no>"
  reference_gen_seconds: [{case: "10", n: 48, seconds: 0.02}]
  notes: >-
    B&B vs C(n,k) subsets. Case 09 is a HARD YES (unique dominating set = the P3 centers
    at high indices, found last by C(n,k), instant for the B&B). Non-gameable even against
    a "search-with-timeout-fallback-to-NO" heuristic. Statement bound n<=30 -> n<=48.
