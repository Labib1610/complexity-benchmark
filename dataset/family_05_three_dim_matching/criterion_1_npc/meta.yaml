family: "05"
family_name: three_dim_matching
criterion: 1
class: NPC
problem_letter: A
intended_algorithm: "backtracking: assign specialists 1..k in order, each taking an allowed combination whose machine and slot are still free; prune on conflict"
reduction_note: "3-DIMENSIONAL MATCHING; NP-complete; Karp (1972)"
constraint_delta: "anchor variant (NP-complete base)"
judge: custom
time_limit_s: 5
memory_limit_mb: 256
scaling:
  # Corrected (file 26/30) rule. Like families 01/02, reference and baseline share the
  # backtracking shape (assign specialists 1..k in order, take an allowed triple whose
  # machine+slot are free, prune on conflict), so hardness comes from INSTANCE
  # structure, not an asymptotic gap. Hard instances sit near the 3DM perfect-matching
  # threshold (triple density t/k ~ 7-8): most are YES, but the rare NO ones -- and
  # some YES ones -- force the search to explore exhaustively. Ground truth is
  # generated offline by the same backtracking; at the model limit the baseline TLEs.
  model_time_limit_s: 5
  baseline_probe:                       # backtracking near the threshold, worst seeds
    - {k: 18, t_over_k: 8,  baseline_s: 2.6}
    - {k: 20, t_over_k: 8,  baseline_s: 11.0}   # crosses the limit
    - {k: 20, t_over_k: 7,  baseline_s: 3.6}
    - {k: 22, t_over_k: 8,  baseline_s: 9.5}    # decisive
  baseline_tle_from_size: 20
  chosen_max_size: 22                   # reference backtracking ~8-11s offline at k=22
  ramp_sizes: [14, 16, 20, 22, 22]      # cases 05-09
  ramp_specs:                           # generator invocation per case
    - {case: "05", k: 14, gen: "--perfect yes", verdict: YES}
    - {case: "06", k: 16, t: 48, gen: "(random, low density)", verdict: NO}
    - {case: "07", k: 20, t: 160, seed: 5, verdict: NO}
    - {case: "08", k: 22, t: 176, seed: 13, verdict: YES}   # HARD YES (see notes)
    - {case: "09", k: 22, t: 165, seed: 5, verdict: NO}
  ramp_verdicts: [YES, NO, NO, YES, NO]
  ramp_baseline: [pass, pass, TLE, TLE, TLE]
  baseline_tle_confirmed: true          # exit=124 at 5s on cases 07,08,09
  gen_command: "tools/gen_family_05.py --criterion 1 --k <k> --t <t> --seed <s> [--perfect yes]"
  reference_gen_seconds:
    - {case: "07", k: 20, seconds: 11}
    - {case: "08", k: 22, seconds: 9}
    - {case: "09", k: 22, seconds: 8}
  notes: >-
    Case 08 is a HARD YES: a near-threshold instance that HAS a perfect 3D matching but
    on which the backtracking baseline TLEs finding it (the reference, run offline,
    produces one valid selection). This keeps the tier non-gameable even against a
    "backtrack-with-timeout-fallback-to-NO" heuristic (it would answer NO on 08 and be
    wrong). Statement bound k<=18 -> k<=22. Low-density instances are all NO but refuted
    instantly (an element is trivially uncoverable), so the hard cases live at the
    threshold density.
