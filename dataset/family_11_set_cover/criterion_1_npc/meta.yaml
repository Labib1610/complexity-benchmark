family: "11"
family_name: set_cover
criterion: 1
class: NPC
problem_letter: A
intended_algorithm: "bitmask DP over covered-skill sets best[mask]=min consultants to reach mask, extending each reachable mask by consultants covering its lowest uncovered skill; feasible iff best[full] <= k; O(2^u * s)"
reduction_note: "SET COVER; NP-complete; Karp (1972); reduction from VERTEX COVER"
constraint_delta: "anchor variant (NP-complete base)"
judge: custom
time_limit_s: 5
memory_limit_mb: 256
scaling:
  # Corrected (file 26/36) rule. Asymptotic gap with an ASYMMETRY: the reference is a
  # bitmask DP over covered-skill sets, O(2^u * s); the baseline
  # (tools/naive_family_11_criterion_1.py) tries all C(s,k) consultant subsets. THE WINDOW
  # COMES FROM FIXING u (the reference's cost, u<=20 -> 2^u<=1M) WHILE GROWING s (the
  # baseline's cost). Instances: `groups` disjoint size-2+ skill groups each covered by one
  # ESSENTIAL consultant (at the highest indices) plus many single-skill DECOY consultants,
  # giving a unique minimum cover of size `groups` found last by the C(s,k) baseline.
  model_time_limit_s: 5
  baseline_probe:                       # fix u, grow s; baseline vs 2^u DP reference
    - {u: 18, s: 50,  k: 5, baseline_s: 0.28, reference_s: 0.01}   # last under 5s
    - {u: 18, s: 60,  k: 6, baseline_s: ">7", reference_s: 0.01}   # crosses the limit
    - {u: 18, s: 80,  k: 6, baseline_s: ">8", reference_s: 0.01}
    - {u: 20, s: 200, k: 7, baseline_s: ">8", reference_s: 0.03}
  baseline_tle_from_size: 60            # s (with k ~ 6)
  chosen_max_size: 200                  # s; reference 2^u DP stays ~0.03s at u=20
  ramp_sizes: [40, 50, 80, 150, 200]    # s per case 06-10
  ramp_specs:
    - {case: "06", u: 18, s: 40,  k: 5, coverable: true,  verdict: YES}
    - {case: "07", u: 18, s: 50,  k: 5, coverable: false, verdict: NO}
    - {case: "08", u: 18, s: 80,  k: 6, coverable: false, verdict: NO}
    - {case: "09", u: 20, s: 150, k: 6, coverable: true,  verdict: YES}   # HARD YES
    - {case: "10", u: 20, s: 200, k: 7, coverable: false, verdict: NO}
  ramp_verdicts: [YES, NO, NO, YES, NO]
  ramp_baseline: [pass, pass, TLE, TLE, TLE]
  baseline_tle_confirmed: true          # exit=124 at 5s on cases 08,09,10
  gen_command: "tools/gen_family_11.py --criterion 1 --u <u> --s <s> --k <k> --seed 1 --coverable <yes|no>"
  reference_gen_seconds: [{case: "10", u: 20, s: 200, seconds: 0.03}]
  notes: >-
    The window is the u-vs-s ASYMMETRY: the 2^u DP reference is unaffected by s while the
    C(s,k) baseline explodes as s grows (u fixed <=20). Case 09 is a HARD YES (unique cover =
    the essential consultants at high indices, found last by C(s,k)) -- non-gameable even vs
    a timeout-fallback-to-NO heuristic. Statement bounds u<=20, s<=200 unchanged (already
    reach the wall).
