family: "16"
family_name: job_shop
criterion: 3
class: INFEASIBLE
problem_letter: C
intended_algorithm: "the largest machine-1 processing time is a lower bound on any finish time; if the deadline T is below it, no schedule can meet the deadline, so print NO"
reduction_note: "single job processing time exceeding the deadline makes any feasible schedule impossible"
constraint_delta: "guarantee one job's total time > deadline; output the job id as certificate"
judge: exact
time_limit_s: 1
memory_limit_mb: 256
scaling:
  # Corrected (file 26/41) rule. Some job's machine-1 time alone exceeds the deadline T, so no
  # schedule can meet it; the reference takes max(p1) and compares to T in O(j). The baseline
  # (tools/naive_family_16_criterion_3.py) does NOT check that bound and instead tries every j!
  # ordering looking for one that meets the deadline; none does, so it explores all j! -> TLE.
  model_time_limit_s: 1
  baseline_probe:
    - {j: 8,      baseline_s: 0.03}     # pass (8!)
    - {j: 1000,   baseline_s: ">1"}     # TLE
    - {j: 200000, baseline_s: ">1"}
  baseline_tle_from_size: 11            # j
  chosen_max_size: 200000
  ramp_sizes: [8, 1000, 10000, 100000, 200000]   # j per case 03-07
  ramp_baseline: [pass, TLE, TLE, TLE, TLE]
  baseline_tle_confirmed: true          # exit=124 at 1s on cases 04,05,06,07
  gen_command: "tools/gen_family_16.py --criterion 3 --j <j> --seed 1"
  reference_gen_seconds: [{case: "07", j: 200000, seconds: 0.04}]
  notes: >-
    O(j) max-p1 check vs an O(j!) scheduling search. As with every INFEASIBLE arm the answer is a
    constant (NO), so it passes by design -- the tier shows the search route TLEs. Statement bound
    j<=2e5 unchanged.
