family: "16"
family_name: job_shop
criterion: 1
class: NPC
problem_letter: A
intended_algorithm: "Giffler-Thompson branch-and-bound over active schedules: repeatedly resolve the machine conflict at the earliest-completing operation, branching over the conflict set, pruned by a machine/job remaining-work lower bound and best-so-far makespan"
reduction_note: "JOB-SHOP SCHEDULING with m>=3 machines; NP-complete; reduction from 3-SAT"
constraint_delta: "anchor variant with m>=3 machines (NP-complete base)"
judge: exact
time_limit_s: 5
memory_limit_mb: 256
scaling:
  # Corrected (file 26/41) rule. NARROWEST WINDOW IN THE SET (like family 01): the reference is
  # a Giffler-Thompson branch-and-bound and a competent baseline
  # (tools/naive_family_16_criterion_1.py) is the SAME B&B with only a weaker (machine-load-only)
  # lower bound. Hardness is purely instance structure (m>=4 with near-tied durations). PROBED
  # HONESTLY: the weaker bound is NOT reliably slower -- across ~48 (j,m,seed) probes it matched
  # the reference within ~10% almost everywhere, and on some seeds the baseline was even FASTER.
  # Only ONE hunted instance (j=9, m=5, seed=4) has the baseline TLE (>5s) while the reference
  # passes (3.2s). So this arm DOES NOT RELIABLY BITE.
  model_time_limit_s: 5
  baseline_probe:                       # weaker-bound baseline vs stronger-bound reference
    - {j: 8, m: 4, seed: 10, baseline_s: 3.07, reference_s: 2.81}   # both pass (no gap)
    - {j: 9, m: 4, seed: 8,  baseline_s: 2.31, reference_s: 2.39}   # baseline FASTER than ref
    - {j: 8, m: 5, seed: 11, baseline_s: 2.36, reference_s: 1.67}
    - {j: 9, m: 5, seed: 4,  baseline_s: ">5", reference_s: 3.17}   # the ONLY window found
  baseline_tle_from_size: null          # no reliable size threshold; window is seed-specific
  baseline_tle_confirmed: false         # DOES NOT RELIABLY BITE -- flag for the user
  chosen_max_size: 49                   # total ops (j=9 m=5 = 45; reference still < 5s here)
  ramp_sizes: [24, 32, 36, 40, 45]      # total ops per case 06-10
  ramp_specs:
    - {case: "06", j: 6, m: 4, seed: 1,  baseline: pass, reference_s: 0.02}
    - {case: "07", j: 8, m: 4, seed: 10, baseline: pass, reference_s: 2.81}
    - {case: "08", j: 9, m: 4, seed: 8,  baseline: pass, reference_s: 2.39}
    - {case: "09", j: 8, m: 5, seed: 11, baseline: pass, reference_s: 1.67}
    - {case: "10", j: 9, m: 5, seed: 4,  baseline: TLE,  reference_s: 3.17}   # only TLE case
  ramp_baseline: [pass, pass, pass, pass, TLE]
  gen_command: "tools/gen_family_16.py --criterion 1 --j <j> --m <m> --seed <s>"
  reference_gen_seconds: [{case: "10", j: 9, m: 5, seconds: 3.17}]
  notes: >-
    NARROW-WINDOW FAMILY (same situation as family 01). The Giffler-Thompson B&B reference and a
    competent weaker-bound B&B baseline blow up at essentially the same size; the weaker bound is
    not reliably slower (sometimes faster). Only one hunted instance (case 10, j=9 m=5 seed 4)
    achieves baseline-TLE-while-reference-passes. baseline_tle_confirmed = FALSE. Per file 41, a
    weaker (strawman) baseline is not acceptable and reference.py is NOT rewritten; carrying this
    NPC arm reliably would need a stronger reference (e.g. CP/SAT) -- that is the USER'S CALL.
    Statement bounds raised j<=6 -> j<=10, ops<=18 -> ops<=50 so the harder instances are legal.
