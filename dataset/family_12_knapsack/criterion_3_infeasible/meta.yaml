family: "12"
family_name: knapsack
criterion: 3
class: INFEASIBLE
problem_letter: C
intended_algorithm: "budget 0 with strictly positive costs and a must-pick-at-least-one rule means no affordable selection exists; print NO"
reduction_note: "budget 0 with all positive item costs: no item can be selected; infeasible by construction"
constraint_delta: "guarantee budget=0 and all item costs>0; output trivial infeasibility"
judge: exact
time_limit_s: 1
memory_limit_mb: 256
scaling:
  # Corrected (file 26/37) rule. Budget B=0 with strictly positive costs and a must-pick-one
  # rule -> no affordable selection; the reference is an O(1) arithmetic check. The baseline
  # (tools/naive_family_12_criterion_3.py) searches subsets for an affordable non-empty one;
  # since every non-empty subset costs > 0 = B it never succeeds and explores the full 2^n
  # tree -> TLEs.
  model_time_limit_s: 1
  baseline_probe:
    - {n: 20, baseline_s: 0.11}         # pass
    - {n: 24, baseline_s: 1.55}         # crosses the 1s limit
    - {n: 30, baseline_s: ">4"}
  baseline_tle_from_size: 24
  chosen_max_size: 40                   # baseline is 2^n and depth-n recursive, kept modest
  ramp_sizes: [20, 26, 30, 36, 40]      # n per case 03-07
  ramp_baseline: [pass, TLE, TLE, TLE, TLE]
  baseline_tle_confirmed: true          # exit=124 at 1s on cases 04,05,06,07
  gen_command: "tools/gen_family_12.py --criterion 3 --n <n> --seed 1"
  reference_gen_seconds: [{case: "07", n: 40, seconds: 0.01}]
  notes: >-
    O(1) B=0 check vs a 2^n subset search. As with every INFEASIBLE arm the answer is a
    constant (NO), so print("NO") passes by design -- the tier shows the search route TLEs.
    Sizes kept <=40 (the 2^n search is depth-n recursive); statement bound n<=2e5 unchanged.
