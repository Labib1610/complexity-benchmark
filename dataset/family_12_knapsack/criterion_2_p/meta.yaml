family: "12"
family_name: knapsack
criterion: 2
class: P
problem_letter: B
intended_algorithm: "sort investments by value/cost ratio descending (exact integer cross-multiplication), take whole while budget allows then a fraction of the next; exact rational arithmetic, output rounded to 6 decimals; O(n log n)"
reduction_note: "fractional knapsack is solvable optimally by greedy ratio sort in O(n log n)"
constraint_delta: "items can be fractionally included; greedy ratio sort gives optimal solution"
judge: exact
time_limit_s: 1
memory_limit_mb: 256
scaling:
  # Corrected (file 26/37) rule. Real asymptotic gap: the reference sorts by value/cost ratio
  # (exact integer cross-multiplication) in O(n log n). The baseline
  # (tools/naive_family_12_criterion_2.py) is the correct greedy but implemented as a repeated
  # O(n) MAX-RATIO SCAN -- O(n^2) -- so it TLEs at large n. Both use exact rational arithmetic
  # (Fraction) and identical 6-decimal rounding, so outputs match on instances the baseline
  # finishes.
  model_time_limit_s: 1
  baseline_probe:                       # O(n^2) scan vs O(n log n) sort
    - {n: 5000,   baseline_s: 0.78}     # last under 1s
    - {n: 10000,  baseline_s: 3.12}     # crosses the limit
    - {n: 100000, baseline_s: ">4"}
  baseline_tle_from_size: 7000
  chosen_max_size: 200000
  ramp_sizes: [1000, 5000, 10000, 100000, 200000]   # n per case 06-10
  ramp_baseline: [pass, pass, TLE, TLE, TLE]
  baseline_tle_confirmed: true          # exit=124 at 1s on cases 08,09,10
  gen_command: "tools/gen_family_12.py --criterion 2 --n <n> --seed 1"
  reference_gen_seconds: [{case: "10", n: 200000, seconds: 0.62}]
  # PRECISION: the reference uses exact Fraction arithmetic then rounds once to 6 decimals via
  # Decimal(ROUND_HALF_UP). Output is fully deterministic (verified byte-identical across
  # repeated runs at n up to 2e5) -- NO floating-point accumulation drift, so exact judging is
  # safe. Costs are kept small (<=5000) so B = sum/2 stays within the B<=1e9 bound while ~n/2
  # items are taken (making the O(n^2) scan actually run n/2 passes).
  notes: >-
    O(n log n) ratio sort vs O(n^2) repeated max-ratio scan; TLEs from n~7000. Reference is
    exact (Fraction) and deterministic -- no precision instability. Statement bounds n<=2e5,
    B<=1e9 unchanged.
