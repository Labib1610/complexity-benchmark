family: "12"
family_name: knapsack
criterion: 1
class: NPC
problem_letter: A
intended_algorithm: "meet-in-the-middle: enumerate subsets of each half; for the right half keep a prefix maximum of value by increasing cost, then binary-search the best affordable complement for each left subset; O(2^(n/2) * n)"
reduction_note: "0-1 KNAPSACK; NP-complete; reduction from SUBSET SUM"
constraint_delta: "anchor variant with weights up to 10^9; pseudo-poly DP is infeasible"
judge: custom
time_limit_s: 5
memory_limit_mb: 256
scaling:
  # Corrected (file 26/37) rule. Mirrors family 04 (subset sum): meet-in-the-middle
  # O(2^(n/2)) reference vs a naive 2^n include/exclude search
  # (tools/naive_family_12_criterion_1.py). Large costs/values (up to 1e9, B up to ~2e10)
  # also block the pseudo-poly O(n*B) DP (tools/naive_family_12_criterion_1_dp.py needs a
  # ~2e10 array -> MemoryError). Budget B = sum(costs)//2 is tight, so pruning barely helps.
  # This is an OPTIMISATION (report the max value + an achieving subset): there is no YES/NO,
  # so a constant cannot game it -- the exact optimum must be computed.
  model_time_limit_s: 5
  baseline_probe:                       # 2^n search vs MITM reference, B ~ sum/2
    - {n: 24, baseline_s: 1.77, reference_s: 0.01}   # last under 5s
    - {n: 26, baseline_s: 6.95, reference_s: 0.02}   # crosses the limit
    - {n: 30, baseline_s: ">8", reference_s: 0.05}
    - {n: 36, baseline_s: ">8", reference_s: 0.50}
  baseline_tle_from_size: 26
  # MEMORY CEILING: the MITM reference sorts 2^(n/2) half-subsets, each a (cost,value,mask)
  # tuple. Measured peak: n=34 -> 73MB, n=36 -> 137MB, n=38 -> 266MB (over 256), n=40 -> 522MB.
  # So the ramp tops out at n=36. Statement bound n<=40 kept (truthful problem class).
  chosen_max_size: 36                   # reference MITM ~0.5s / 137MB at n=36
  ramp_sizes: [22, 24, 28, 32, 36]      # n per case 06-10
  ramp_baseline: [pass, pass, TLE, TLE, TLE]
  baseline_tle_confirmed: true          # exit=124 at 5s on cases 08,09,10
  dp_route_blocked: "naive_family_12_criterion_1_dp.py at n=38 -> MemoryError (dp array of size B ~ 2e10)"
  gen_command: "tools/gen_family_12.py --criterion 1 --n <n> --seed 1"
  reference_gen_seconds: [{case: "10", n: 36, seconds: 0.50}]
  notes: >-
    2^(n/2) MITM vs 2^n search, both naive routes blocked (2^n search TLEs; pseudo-poly DP
    MemoryErrors on B ~ 2e10). Optimisation output (max value + subset), so non-gameable.
    Statement n<=40 kept; the ramp caps at n=36 because the string/tuple-storing MITM peaks
    at ~137MB there and OOMs (>256MB) by n=38.
