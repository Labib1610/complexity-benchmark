family: "08"
family_name: vertex_cover
criterion: 3
class: INFEASIBLE
problem_letter: C
intended_algorithm: "greedily collect edges whose endpoints are still unused until k+1 pairwise independent edges are found; this matching is a lower bound certifying k guards cannot cover all edges"
reduction_note: "maximum matching is a lower bound on vertex cover; if matching size > k no cover of size k exists"
constraint_delta: "guarantee matching size > budget k; output the matching as infeasibility certificate"
judge: custom
time_limit_s: 2
memory_limit_mb: 256
scaling:
  # Corrected (file 26/33) rule. The reference greedily collects k+1 pairwise independent
  # corridors (a matching lower bound) in O(m). The realistic baseline
  # (tools/naive_family_08_criterion_3.py) does NOT reason via the matching bound and
  # instead first tries to FIND a size-k vertex cover (the same 2^k bounded search),
  # emitting the certificate only after convincing itself none exists. Since a planted
  # matching of k+1 disjoint edges exists, no size-k cover does, so the search explores
  # 2^k nodes and TLEs.
  model_time_limit_s: 2
  baseline_probe:                       # bounded-search VC(k) attempt, n=1e5 m=2e5
    - {k: 15, baseline_s: 0.11}
    - {k: 20, baseline_s: 0.96}         # last under 2s
    - {k: 25, baseline_s: ">6"}         # crosses the limit
    - {k: 30, baseline_s: ">6"}
  baseline_tle_from_size: 23            # k
  chosen_max_size: 50                   # k; baseline is exponential in k so kept modest
  ramp_sizes: [16, 26, 31, 41, 51]      # number of independent corridors output (k+1)
  ramp_specs:
    - {case: "03", n: 100000, m: 200000, k: 15}
    - {case: "04", n: 100000, m: 200000, k: 25}
    - {case: "05", n: 100000, m: 200000, k: 30}
    - {case: "06", n: 100000, m: 200000, k: 40}
    - {case: "07", n: 100000, m: 200000, k: 50}
  ramp_baseline: [pass, TLE, TLE, TLE, TLE]
  baseline_tle_confirmed: true          # exit=124 at 2s on cases 04,05,06,07
  gen_command: "tools/gen_family_08.py --criterion 3 --n 100000 --m 200000 --k <k> --seed 1"
  reference_gen_seconds: [{case: "07", k: 50, seconds: 0.07}]   # greedy O(m)
  notes: >-
    Greedy O(m) matching certificate vs a 2^k cover search. The baseline TLEs from k~23
    (recursion depth = k, kept <=50 so it stays safe). n=1e5, m=2e5 are large so the
    reference's O(m) scan is exercised; statement bounds n<=1e5, m<=2e5, k<=1e5 unchanged.
    The custom validator checks the printed corridors are real, pairwise independent, and
    exactly k+1 -- verified at scale.
