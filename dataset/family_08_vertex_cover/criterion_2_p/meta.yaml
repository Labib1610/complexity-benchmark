family: "08"
family_name: vertex_cover
criterion: 2
class: P
problem_letter: B
intended_algorithm: "Hopcroft-Karp maximum matching between the two wings; by König's theorem the minimum vertex cover equals the maximum matching size; output that size"
reduction_note: "König's theorem: in bipartite graphs minimum vertex cover equals maximum matching size"
constraint_delta: "graph restricted to bipartite; König's theorem gives polynomial minimum cover"
judge: exact
time_limit_s: 2
memory_limit_mb: 256
scaling:
  # Corrected (file 26/33) rule. Real gap via Koenig's theorem: minimum vertex cover =
  # maximum matching. The reference is Hopcroft-Karp O(E*sqrt V) (NO reference change was
  # needed -- it was already HK). The realistic baseline
  # (tools/naive_family_08_criterion_2.py) is Kuhn's augmenting-path matching O(V*E),
  # which prints the same integer but, on a lower-triangular 'staircase' (long augmenting
  # chains), does the full O(V*E) work and TLEs.
  model_time_limit_s: 2
  baseline_probe:                       # Kuhn vs HK on the staircase (nA=nB=k)
    - {k: 600,  m: 180300, kuhn_s: 0.41, hk_s: 0.07}   # last under 2s
    - {k: 800,  m: 320400, kuhn_s: 1.54, hk_s: 0.11}
    - {k: 1000, m: 500500, kuhn_s: 3.80, hk_s: 0.17}   # crosses 2s
    - {k: 1200, m: 720600, kuhn_s: 6.5,  hk_s: 0.29}
  baseline_tle_from_size: 900           # nA=nB
  chosen_max_size: 1200
  ramp_sizes: [400, 600, 1000, 1100, 1200]   # nA=nB per case 06-10
  ramp_answers: [400, 600, 1000, 1100, 1200] # min cover = matching size (all differ)
  ramp_baseline: [pass, pass, TLE, TLE, TLE]
  baseline_tle_confirmed: true          # exit=124 at 2s on cases 08,09,10
  gen_command: "tools/gen_family_08.py --criterion 2 --nA <k> --nB <k> --mode hard --seed 1"
  reference_gen_seconds: [{case: "10", nA: 1200, seconds: 0.29}]
  notes: >-
    Kuhn (O(V*E)) TLEs on the staircase from nA=nB~900 while Hopcroft-Karp stays under
    0.3s. The gap is narrow (Kuhn is fast in practice), so m bound raised 2e5 -> 8e5 to
    reach the wall; nA,nB<=1e5 unchanged. The min-cover sizes differ across cases so no
    constant integer passes.
