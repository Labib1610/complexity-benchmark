family: "08"
family_name: vertex_cover
criterion: 1
class: NPC
problem_letter: A
intended_algorithm: "bounded search tree: pick an uncovered edge and branch on including endpoint u or v; recursion depth bounded by k; O(2^k * m)"
reduction_note: "VERTEX COVER; NP-complete; complement of INDEPENDENT SET; Karp (1972)"
constraint_delta: "anchor variant (NP-complete base)"
judge: custom
time_limit_s: 5
memory_limit_mb: 256
scaling:
  # Corrected (file 26/33) rule. Asymptotic gap: the reference is a bounded-search-tree
  # (FPT) branching, O(2^k * m); the realistic baseline
  # (tools/naive_family_08_criterion_1.py) tries all C(n,k) k-subsets. Raising n while
  # keeping k near the true minimum cover makes C(n,k) explode; the 2^k reference is
  # unaffected. Instances are disjoint P3 paths (leaf-center-leaf): a graph of t P3s has
  # a UNIQUE minimum cover of size t (the centers), placed at the HIGHEST indices so the
  # C(n,k) enumeration (lexicographic) reaches the one good cover last.
  model_time_limit_s: 5
  baseline_probe:                       # C(n,k) baseline vs 2^k reference, P3 construction
    - {k: 8,  n: 24, coverable: true,  baseline_s: 0.32, reference_s: 0.01}
    - {k: 8,  n: 27, coverable: false, baseline_s: 0.71, reference_s: 0.01}   # last under 5s
    - {k: 10, n: 30, coverable: true,  baseline_s: ">8", reference_s: 0.01}   # crosses limit
    - {k: 12, n: 36, coverable: false, baseline_s: ">8", reference_s: 0.02}
  baseline_tle_from_size: 10            # k (n = 3k)
  chosen_max_size: 18                   # k; 2^18 reference stays fast (n up to 3k)
  ramp_sizes: [24, 24, 33, 39, 45]      # n per case 06-10
  ramp_specs:
    - {case: "06", k: 8,  coverable: true,  verdict: YES}
    - {case: "07", k: 8,  coverable: false, verdict: NO}
    - {case: "08", k: 11, coverable: false, verdict: NO}
    - {case: "09", k: 13, coverable: true,  verdict: YES}   # HARD YES (see notes)
    - {case: "10", k: 15, coverable: false, verdict: NO}
  ramp_verdicts: [YES, NO, NO, YES, NO]
  ramp_baseline: [pass, pass, TLE, TLE, TLE]
  baseline_tle_confirmed: true          # exit=124 at 5s on cases 08,09,10
  gen_command: "tools/gen_family_08.py --criterion 1 --k <k> --seed 1 --coverable <yes|no>"
  reference_gen_seconds: [{case: "10", n: 45, seconds: 0.04}]   # all instant (2^k)
  notes: >-
    2^k branching vs C(n,k) subsets. Case 09 is a HARD YES: a feasible instance whose
    UNIQUE minimum cover (the P3 centers, at high indices) is found last by the C(n,k)
    baseline, so it TLEs, while the 2^k reference finds it instantly. This keeps the tier
    non-gameable even against a "search-with-timeout-fallback-to-NO" heuristic (it would
    answer NO on 09 and be wrong). Statement bound n<=40 -> n<=54 (k<=18 unchanged); n is
    raised, not k, because that is what kills the C(n,k) baseline.
