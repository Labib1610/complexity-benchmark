family: "01"
family_name: graph_coloring
criterion: 2
class: P
problem_letter: B
intended_algorithm: "BFS 2-coloring; assign shift 1 to lowest-indexed unvisited node per component; O(n+m)"
reduction_note: "2-COLORING = bipartiteness testing; only obstruction is an odd cycle"
constraint_delta: "shifts reduced 3->2; removes NP-hardness entirely"
judge: exact
time_limit_s: 1
memory_limit_mb: 256
scaling:
  ceiling_probe:
    - {size: 50000, reference_s: 0.116}
    - {size: 100000, reference_s: 0.241}
    - {size: 200000, reference_s: 0.283}
  chosen_max_size: 200000
  ramp_sizes: [1000, 10000, 50000, 100000, 200000]   # cases 05-09
  ramp_notes: "05 YES, 06 NO (planted odd cycle), 07 YES, 08 YES, 09 YES with 2000 components"
  naive_tle_confirmed: true
  naive_time_at_max: ">5s killed (tools/naive_family_01_criterion_2.py, O(n*m) edge-rescan BFS; limit 1s)"
  notes: >-
    P arm. Reference O(n+m) BFS runs in 0.28s at n=m=2e5. A correct-but-inefficient
    O(n*m) BFS that rescans the edge list for neighbours TLEs; a literal n x n matrix
    would OOM at this size, so the edge-rescan variant is used to demonstrate the
    timing point cleanly. The 2000-component case exercises the per-component
    lex-smallest assignment rule. m capped at 2e5 per the statement bound.
