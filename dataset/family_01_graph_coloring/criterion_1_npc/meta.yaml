family: "01"
family_name: graph_coloring
criterion: 1
class: NPC
problem_letter: A
intended_algorithm: "lexicographically-smallest backtracking over 3 colors"
reduction_note: "3-COLORING; Karp 21; reduction from 3-SAT via palette gadget; NP-complete even for max-degree 4"
constraint_delta: "anchor variant (NP-complete base)"
judge: exact
time_limit_s: 2
memory_limit_mb: 256
scaling:
  # Corrected rule (file 25/26 corrected): size is chosen by where the REALISTIC
  # baseline (pruned backtracking, tools/naive_family_01_criterion_1.py) exceeds
  # the model's time_limit_s. Reference .out generation is offline/unlimited and
  # does NOT constrain size. Adversarial seed 4 (and 3) near ratio m~2.35n.
  baseline_probe:                       # realistic pruned-backtracking baseline, worst hard seed
    - {size: 30, seed: 4,  baseline_s: 0.07}    # passes (all seeds fast)
    - {size: 32, seed: 4,  baseline_s: 3.5}     # first size over the 2s limit
    - {size: 34, seed: 4,  baseline_s: 10.8}    # in the wall
    - {size: 38, seed: 4,  baseline_s: 8.9}     # TLE
    - {size: 40, seed: 3,  baseline_s: 37.3}    # decisive TLE
    - {size: 42, seed: 4,  baseline_s: 20.3}
  model_time_limit_s: 2
  baseline_tle_from_size: 32            # smallest n where an adversarial seed exceeds 2s
  chosen_max_size: 40
  ramp_sizes: [30, 32, 34, 38, 40, 38, 40]      # cases 05-11
  ramp_seeds: [1, 11, 4, 4, 3, 1040, 711]
  ramp_verdicts: [YES, YES, NO, NO, NO, YES, YES]  # print("NO") now fails 4 of 7
  hard_instance_ratio: 2.35             # edges/n near the random-3-coloring phase transition
  baseline_tle_confirmed: true          # baseline exit=124 at 2s on cases 07,08,09,10,11
  # file-49 regeneration: the scaled tier was gameable. Cases 07/08/09 were all NO,
  # so print("NO") passed all three; case 07 also contained a K4 (trivial refutation).
  # Fixed by (a) regenerating 07 K4-free so refutation needs search, and (b) adding
  # two HARD YES cases (10, 11) so a give-up "NO" now fails 4 of 7. Each YES/NO is a
  # genuine TLE: the realistic baseline (tools/naive_family_01_criterion_1.py) exceeds
  # 2s on all four hard cases while a forward-checking solver still wins sub-second
  # (the known narrow P-vs-NPC window at n<=40). YES cases are colourable but the
  # naive index-order path searches deep before finding the lex-smallest colouring.
  regenerated_cases:
    - {case: "07", size: 34, seed: 4,    ratio: 2.35, k4_free: true,  verdict: NO,
       gen: "gen_family_01.py --criterion 1 --n 34 --seed 4 --ratio 2.35 --k4free",
       baseline_s: 6.4, ref_gen_s: 18}
    - {case: "10", size: 38, seed: 1040, ratio: 2.34, k4_free: false, verdict: YES,
       gen: "gen_family_01.py --criterion 1 --n 38 --seed 1040 --ratio 2.34",
       baseline_s: 6.2, ref_gen_s: 17}
    - {case: "11", size: 40, seed: 711,  ratio: 2.35, k4_free: false, verdict: YES,
       gen: "gen_family_01.py --criterion 1 --n 40 --seed 711 --ratio 2.35",
       baseline_s: 3.5, ref_gen_s: 9}
  # NOTE: case 10 uses n=38 rather than the nominal ~36. Satisfiable instances at
  # n<=37 do not force the naive baseline past ~2.5s (only ~25% over the 2s limit,
  # inside the timing-fragility band); n=38 gives a robust >6s TLE. NO instances go
  # much deeper, so 07 stays at n=34.
  reference_gen_seconds:                # informational only; offline one-time cost, NOT a constraint
    - {case: "07", size: 34, seconds: 18}
    - {case: "08", size: 38, seconds: 24}
    - {case: "09", size: 40, seconds: 105}
    - {case: "10", size: 38, seconds: 17}
    - {case: "11", size: 40, seconds: 9}
  notes: >-
    Pushed INTO the exponential wall. A realistic pruned-backtracking solution (the
    kind a competent model writes) TLEs at the 2s model limit on the hard cases
    (07,08,09 NO; 10,11 YES) while passing n=30,32 -- so the NPC arm bites. The
    reference is the same 3^n shape, so generating the .out for case 09 took ~105s
    offline (fine: unlimited one-time cost; reference_check validates it with
    REFERENCE_CHECK_TIMEOUT_S). Statement bound 30 -> 40. file-49 update: scaled tier
    de-gamed -- 07 regenerated K4-free (search-based refutation) and hard YES cases
    10,11 added so print("NO") no longer passes the tier (fails 4 of 7). Supersedes
    the earlier (deleted) rule that sized by reference speed.
