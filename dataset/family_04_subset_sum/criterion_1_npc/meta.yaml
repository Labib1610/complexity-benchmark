family: "04"
family_name: subset_sum
criterion: 1
class: NPC
problem_letter: A
intended_algorithm: "meet-in-the-middle: enumerate all subset sums of each half (2^(n/2)), hash one half by sum, and for each sum s in the other half look up the complement T - s"
reduction_note: "SUBSET SUM; NP-complete; reduction from 3-SAT via binary encoding"
constraint_delta: "anchor variant with values up to 10^9; rules out pseudo-poly DP"
judge: custom
time_limit_s: 5
memory_limit_mb: 256
scaling:
  # REBUILT per audit B2/B3/B6. Reference is meet-in-the-middle O(2^(n/2)); the realistic
  # baseline (tools/naive_family_04_criterion_1.py) is recursive include/exclude search O(2^n)
  # with "prune when running sum > target". Large values (up to 1e9, T up to ~4e10) also block
  # the pseudo-poly DP-over-sums route (tools/naive_family_04_criterion_1_dp.py needs a ~20 GB
  # array -> TLE/OOM).
  model_time_limit_s: 5
  #
  # AUDIT FIX (B2/B3): the old hard-NO instances used "all-even values + odd target", which is
  # PARITY-TRIVIAL -- a solver that checks gcd answers NO instantly with no search, so the tier
  # was calibrated against a straw baseline. Hard-NO instances are now GENUINE: random coprime
  # values (gcd=1, no modular shortcut) with the target verified infeasible by MITM. Because
  # random subset sums densely cover [0,total] once 2^n exceeds the value range, a genuine NO is
  # only constructible for n<=~32; above that the ramp uses HARD-YES instances (a single deep
  # large-value witness) which the naive search still TLEs finding while MITM locates instantly.
  #
  # MEMORY CEILING (measured on the target machine): the MITM reference materialises 2^(n/2)
  # (sum,mask) entries per half. Under the 256 MB limit it validates through n=38 (0.28 s) but
  # ERRORS at n=40 (2^20 tuples per half exceeds 256 MB). So the ramp tops out at n=38. The
  # statement bound n<=40 is kept (truthful problem class); the reference is what caps the ramp.
  chosen_max_size: 38                    # MITM ref 0.28s @ <256MB at n=38; n=40 exceeds 256MB
  ramp_sizes: [26, 30, 32, 36, 38]       # cases 06-10
  ramp_kind:  [no, yes, no, yes, yes]    # genuine NO up to 32; hard-YES witness at 36,38
  ramp_verdicts: [NO, YES, NO, YES, YES]
  ramp_baseline: [TLE, TLE, TLE, TLE, TLE]
  # MEASURED on target machine (Python 3.12), reference vs naive baseline (4-5 s cap):
  baseline_matrix:
    - {size: 26, kind: no,  ref_s: 0.016, ref_mb: "<256", naive: TLE}
    - {size: 32, kind: no,  ref_s: 0.038, ref_mb: "<256", naive: TLE}
    - {size: 36, kind: yes, ref_s: 0.143, ref_mb: "<256", naive: TLE}
    - {size: 38, kind: yes, ref_s: 0.275, ref_mb: "<256", naive: TLE}
    - {size: 40, kind: yes, ref_s: 0.444, ref_mb: ">256", naive: TLE}   # excluded (OOM)
  baseline_tle_confirmed: true
  dp_route_blocked: "naive_family_04_criterion_1_dp.py at large T (~4e10) needs a ~20 GB array -> TLE/OOM"
  gen_command: "tools/gen_family_04.py --criterion 1 --n <n> --seed <s> --kind <yes|no|rand>"
  honest_limitation: >-
    This is the inherent gradeable-NPC ceiling the audit describes: a case must be solvable by
    the reference to have an answer key, so it can never be hard for an equally-good solver. A
    model that writes meet-in-the-middle solves every case here in <0.5 s. The tier separates
    naive O(2^n) search (and pseudo-poly DP) from MITM -- it does NOT prove hardness against a
    competent exact solver, and must not be reported as such.
  notes: >-
    2^(n/2) reference vs 2^n baseline. Hard-YES cases (36, 38) plant a single deep large-value
    witness that a naive search TLEs finding while MITM locates it instantly -- non-gameable even
    by a "search-with-timeout-fallback-to-NO" heuristic (which answers NO and is wrong). All
    hard-NO cases are genuine (coprime, MITM-verified), removing the old parity shortcut.
