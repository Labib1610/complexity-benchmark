family: "02"
family_name: sat
criterion: 1
class: NPC
problem_letter: A
intended_algorithm: "backtracking DPLL with unit propagation; try value 0 then 1 per variable to guarantee lex-smallest"
reduction_note: "3-SAT; Cook-Levin (1971); canonical NP-complete problem"
constraint_delta: "anchor variant (NP-complete base)"
judge: exact
time_limit_s: 2
memory_limit_mb: 256
scaling:
  # Corrected (file 26/27) rule: size is chosen by where the REALISTIC baseline
  # (tools/naive_family_02_criterion_1.py = DPLL with unit propagation, index-order,
  # 0-before-1) exceeds the model's time_limit_s. Ground-truth generation is offline
  # and unlimited. Like Family 01 criterion 1, there is NO asymptotic gap here: the
  # reference and baseline share the same DPLL+UP shape (2^n); hardness comes purely
  # from instance structure at the random-3-SAT phase transition m/n ~ 4.26.
  #
  # UNBLOCKED (file: reference upgrade, user-approved): the reference formerly did
  # forward-checking backtracking WITHOUT unit propagation, so it was far slower than
  # the baseline and could not generate ground truth at the sizes where the baseline
  # TLEs. reference.py was upgraded to DPLL+UP -- which is what intended_algorithm
  # already documented. The upgrade is OUTPUT-PRESERVING (UP only forces implied
  # literals, so the lex-smallest 0-before-1 assignment is unchanged): verified
  # byte-identical to the old reference on the anchors 01-04 and on 500 random
  # instances (370 SAT / 130 UNSAT), 0 mismatches.
  model_time_limit_s: 2
  hard_instance_ratio: 4.26             # random-3-SAT phase transition (clauses/vars)
  baseline_probe:                       # DPLL+UP baseline, worst-of-8-seeds at ratio 4.26
    - {size: 65, baseline_s: 0.5}       # all seeds fast
    - {size: 70, baseline_s: 1.6}       # hard UNSAT seeds emerge
    - {size: 75, baseline_s: 2.2}       # first adversarial seed over 2s
    - {size: 80, baseline_s: 2.8}       # into the wall
    - {size: 85, baseline_s: 5.9}       # decisive TLE
    - {size: 90, baseline_s: 5.7}       # decisive TLE
  baseline_tle_from_size: 75            # smallest n where an adversarial seed exceeds 2s
  chosen_max_size: 90
  ramp_sizes: [60, 70, 80, 85, 90]      # cases 05-09
  ramp_seeds: [1, 7, 6, 3, 5]
  ramp_verdicts: [YES, NO, NO, YES, NO] # mixed: neither print("YES") nor print("NO") passes
  ramp_baseline_s: [0.0, 1.2, 2.6, 3.4, 5.3]   # baseline passes 05-06, TLEs 07-09
  baseline_tle_confirmed: true          # exit=124 at 2s on cases 07,08,09
  gen_command: "tools/gen_family_02.py --criterion 1 --n <size> --seed <seed> --ratio 4.26"
  reference_gen_seconds:                # informational; offline one-time cost, NOT a constraint
    - {case: "05", size: 60, seconds: 0.0}
    - {case: "06", size: 70, seconds: 1.2}
    - {case: "07", size: 80, seconds: 2.6}
    - {case: "08", size: 85, seconds: 3.5}
    - {case: "09", size: 90, seconds: 5.2}
  notes: >-
    A realistic DPLL+UP solution TLEs at the 2s model limit on the hard cases
    (07 n=80 UNSAT, 08 n=85 SAT, 09 n=90 UNSAT) while passing n=60,70 -- so the NPC
    arm bites. The ramp straddles the phase transition and mixes SAT/UNSAT so a
    constant "YES"/"NO" cannot game the tier. Statement bound n<=40 -> n<=90,
    m<=200 -> m<=400 (max m = round(4.26*90) = 383). Reference upgraded to DPLL+UP
    (output-preserving) so the same algorithm generates ground truth offline in a
    few seconds while the baseline TLEs online -- the Family-01 narrow-window design.
