family: "02"
family_name: sat
criterion: 3
class: INFEASIBLE
problem_letter: C
intended_algorithm: "implication graph + Kosaraju SCC; find smallest variable i where true-literal and false-literal share an SCC"
reduction_note: "2-SAT with contradiction: x and negation-x in same SCC certifies unsatisfiability"
constraint_delta: "guarantee contradiction cycle exists; task is to output the smallest contradicted variable"
judge: exact
time_limit_s: 1
memory_limit_mb: 256
scaling:
  # Realistic baseline = O(n*m) per-variable propagation search for the trapped
  # variable (no SCC shortcut). Reference is O(n+m) SCC. A HIGH-index contradiction
  # forces the naive to scan nearly all variables -> O(n*m).
  baseline_probe:
    - {size: 1000, contra: high, baseline_s: 2.0}
    - {size: 2000, contra: high, baseline_s: 8.8}
    - {size: 5000, contra: high, baseline_s: ">30"}
  model_time_limit_s: 1
  baseline_tle_from_size: 2000          # with a high-index contradiction
  chosen_max_size: 100000
  ramp_sizes: [1000, 2000, 3000, 10000, 100000]   # cases 04-08
  ramp_notes: >-
    04 n=1000 low-index contradiction (naive finds it fast -> pass, answer 2);
    05 n=2000 low (pass, answer 2); 06 n=3000 high (TLE, answer 3000);
    07 n=10000 high (TLE); 08 n=100000 high (TLE). The high-index contradiction
    both forces the O(n*m) scan and tests the smallest-index tie-break (a solution
    reporting the first contradiction it stumbles on rather than the smallest fails).
  baseline_tle_confirmed: true          # exit 124 at 1s on cases 06,07,08
  reference_gen_seconds_at_max: "<0.2"  # SCC O(n+m); ground-truth generation is instant
  notes: "INFEASIBLE arm, genuine asymptotic gap (O(n+m) SCC vs O(n*m)). m capped at 2e5."
