family: "06"
family_name: bin_packing
criterion: 3
class: INFEASIBLE
problem_letter: C
intended_algorithm: "scan weights left to right; print the 1-based index of the first item with weight > C (certifies infeasibility)"
reduction_note: "single item larger than any bin cannot be packed; trivial certificate"
constraint_delta: "guarantee one item exceeds all bin capacities; output the item id"
judge: exact
time_limit_s: 1
memory_limit_mb: 256
scaling:
  # Corrected (file 26/31) rule. The reference scans weights in O(n) and prints the
  # first item heavier than C. The realistic baseline
  # (tools/naive_family_06_criterion_3.py) does NOT notice the oversized item and
  # instead tries to actually pack the shipment (guessing ceil(sum/C) containers and
  # backtracking in input order). No packing exists; with the oversized item at a HIGH
  # index the search packs the earlier tight (near-C/2) items in exponentially many
  # ways before failing, so it TLEs. The O(n) scan is instant.
  model_time_limit_s: 1
  baseline_probe:                       # packing backtracking, oversized at high index
    - {n: 8,    baseline_s: 0.02}       # last under 1s
    - {n: 10,   baseline_s: ">4"}       # crosses the limit
    - {n: 100,  baseline_s: ">4"}
    - {n: 1000, baseline_s: ">4"}
  baseline_tle_from_size: 10
  chosen_max_size: 1000                 # kept <= 1000 so the depth-n recursion is safe
  ramp_sizes: [8, 20, 100, 500, 1000]   # cases 03-07
  ramp_oversized_at: [8, 20, 100, 500, 1000]   # oversized item at the HIGH index
  ramp_answers: [8, 20, 100, 500, 1000]        # smallest oversized index
  ramp_baseline: [pass, TLE, TLE, TLE, TLE]
  baseline_tle_confirmed: true          # exit=124 at 1s on cases 04,05,06,07
  gen_command: "tools/gen_family_06.py --criterion 3 --n <n> --C 1000 --seed 1 --at high"
  reference_gen_seconds: [{case: "07", n: 1000, seconds: 0.01}]   # O(n) scan, instant
  notes: >-
    The oversized item makes the answer a single index found in O(n). A solution that
    instead tries to pack the shipment (exponential backtracking) TLEs from n~10; the
    oversized item is placed at the HIGH index so the search explores the tight earlier
    items before failing. Answers differ across cases, so no constant index passes.
    Sizes capped at n=1000 to keep the depth-n recursion safe (no stack overflow).
    Statement bound n<=2e5 unchanged.
