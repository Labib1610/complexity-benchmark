family: "06"
family_name: bin_packing
criterion: 1
class: NPC
problem_letter: A
intended_algorithm: "minimum number of containers: from the lower bound ceil(sum/C) upward, test feasibility with heaviest-first backtracking + empty-container symmetry cut; report the first feasible count and its assignment"
reduction_note: "BIN PACKING (minimisation); NP-complete; reduction from PARTITION"
constraint_delta: "general min-bins optimisation; anchor variant (NP-complete base)"
judge: custom
time_limit_s: 5
memory_limit_mb: 256
scaling:
  # REBUILT per audit B4. The family now uses ONE indivisible OPTIMISATION contract across
  # conditions: minimise containers, report the count + one assignment (was: criterion 1 an
  # indivisible feasibility decision with a k budget, criterion 2 DIVISIBLE bin packing -- a
  # different task/output/schema). Unified schema: "n C" + weights.
  model_time_limit_s: 5
  # Instances: n=2k complementary pairs (x, C-x) near C/2 summing to k*C, so the minimum is exactly
  # k containers (a perfect packing) and a search without symmetry breaking explores astronomically
  # many equivalent orderings. Reference computes the exact minimum (n <= 28).
  chosen_max_size: 28                     # n items
  ramp_sizes: [8, 12, 16, 20, 24, 26, 28]  # n per higher cases
  gen_command: "tools/gen_family_06.py --criterion 1 --k <pairs> --C <C> --seed <s>"
  # objective.py present: partial-credit container-count scoring under the time-budget study (B7).
  honest_limitation: >-
    Inherent gradeable-NPC ceiling (see family_04 REBUILD_NOTES): the reference must compute the exact
    minimum, so a case must stay small enough (n<=28) for the search to finish under the limit. The
    tier separates a symmetry-blind search from the symmetry-cut search; it does NOT prove hardness
    against a competent solver, and must not be reported as such.
  notes: >-
    Min-bins optimisation output (count + assignment), so a constant cannot game it. Perfect-packing
    pairs near C/2 make the minimum exactly k and force heavy search. Verified against brute-force
    minimum bins on small instances. objective.py added for approximation scoring (B7).
