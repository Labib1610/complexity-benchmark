family: "09"
family_name: clique_independent_set
criterion: 1
class: NPC
problem_letter: A
intended_algorithm: "bitset branch-and-bound: maintain current clique R and candidate set P (vertices adjacent to all of R), extend until |R|=k, prune when |R|+|P|<k"
reduction_note: "CLIQUE; NP-complete; Karp (1972); complement reduction from INDEPENDENT SET"
constraint_delta: "anchor variant (NP-complete base)"
judge: custom
time_limit_s: 5
memory_limit_mb: 256
scaling:
  # Corrected (file 26/34) rule. Asymptotic gap: the reference is a bitset branch-and-bound
  # (maintain clique R and candidate set P, prune when |R|+|P|<k), effectively 2^k-ish with
  # heavy pruning; the realistic baseline (tools/naive_family_09_criterion_1.py) checks all
  # C(n,k) k-subsets. Random graphs at p=0.5 have max clique ~2*log2(n); setting k just above
  # that gives hard NO instances (exhaustive refutation), and a PLANTED clique on the highest-
  # indexed vertices gives a hard YES (found last by the lexicographic C(n,k) enumeration).
  model_time_limit_s: 5
  baseline_probe:                       # C(n,k) baseline vs bitset B&B reference, p=0.5
    - {n: 26, k: 9,  baseline_s: 0.47, reference_s: 0.01}   # last under 5s
    - {n: 30, k: 10, baseline_s: 4.36, reference_s: 0.01}
    - {n: 36, k: 12, baseline_s: ">8", reference_s: 0.01}   # crosses the limit
    - {n: 46, k: 14, baseline_s: ">8", reference_s: 0.01}
  baseline_tle_from_size: 32            # n
  chosen_max_size: 46                   # reference B&B stays ~0.01s (heavy pruning)
  ramp_sizes: [26, 24, 36, 40, 46]      # n per case 06-10
  ramp_specs:
    - {case: "06", n: 26, k: 9,  has_clique: true,  verdict: YES}
    - {case: "07", n: 24, k: 10, has_clique: false, verdict: NO}
    - {case: "08", n: 36, k: 12, has_clique: false, verdict: NO}
    - {case: "09", n: 40, k: 13, has_clique: true,  verdict: YES}   # HARD YES (see notes)
    - {case: "10", n: 46, k: 14, has_clique: false, verdict: NO}
  ramp_verdicts: [YES, NO, NO, YES, NO]
  ramp_baseline: [pass, pass, TLE, TLE, TLE]
  baseline_tle_confirmed: true          # exit=124 at 5s on cases 08,09,10
  gen_command: "tools/gen_family_09.py --criterion 1 --n <n> --k <k> --seed 1 --has_clique <yes|no>"
  reference_gen_seconds: [{case: "10", n: 46, seconds: 0.01}]   # all instant (B&B pruning)
  notes: >-
    Bitset B&B vs C(n,k) subsets. Case 09 is a HARD YES: a planted k-clique on the highest-
    indexed vertices, found last by the C(n,k) baseline (so it TLEs) but instantly by the
    B&B reference. This keeps the tier non-gameable even against a "search-with-timeout-
    fallback-to-NO" heuristic. Statement bound n<=40 -> n<=46 (n raised, not k, since that is
    what kills C(n,k); the B&B reference is unaffected).
