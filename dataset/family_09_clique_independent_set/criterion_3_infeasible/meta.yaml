family: "09"
family_name: clique_independent_set
criterion: 3
class: INFEASIBLE
problem_letter: C
intended_algorithm: "pigeonhole: a group cannot exceed the n users that exist, so r > n is immediately impossible; print NO"
reduction_note: "pigeonhole principle: k-clique requires k<=n nodes; k>n is immediately infeasible"
constraint_delta: "guarantee k > |V|; output trivial pigeonhole impossibility certificate"
judge: exact
time_limit_s: 1
memory_limit_mb: 256
scaling:
  # Corrected (file 26/34) rule. r > n, so by pigeonhole no group of r users can exist -- the
  # reference is O(1) (prints NO). The realistic baseline
  # (tools/naive_family_09_criterion_3.py) does NOT apply the pigeonhole and instead searches
  # for an r-clique by extending cliques vertex by vertex; since r > n it never reaches size r
  # and explores every clique in the graph -- exponentially many in a dense graph -- so it TLEs.
  model_time_limit_s: 1
  baseline_probe:                       # clique-extension baseline on dense G(n), r=n+1
    - {n: 20, baseline_s: 0.20}
    - {n: 22, baseline_s: 0.81}         # last under 1s
    - {n: 24, baseline_s: ">3"}         # crosses the limit
    - {n: 40, baseline_s: ">3"}
  baseline_tle_from_size: 24
  chosen_max_size: 46                   # dense moderate n (the search is exponential, not size-driven)
  ramp_sizes: [20, 28, 32, 40, 46]      # n per case 03-07 (dense: m = n(n-1)/2)
  ramp_baseline: [pass, TLE, TLE, TLE, TLE]
  baseline_tle_confirmed: true          # exit=124 at 1s on cases 04,05,06,07
  gen_command: "tools/gen_family_09.py --criterion 3 --n <n> --m <n(n-1)/2> --seed 1"
  reference_gen_seconds: [{case: "07", n: 46, seconds: 0.01}]   # O(1) after reading
  notes: >-
    Pigeonhole (r > n) makes the answer O(1). A solution that searches subsets/cliques anyway
    TLEs from n~24 on a dense graph (exponentially many cliques). As with every INFEASIBLE arm
    the answer is a constant (NO), so print("NO") passes by design -- the tier demonstrates
    that the search route TLEs. Cases use dense graphs at moderate n (the blow-up is from the
    clique count, not size); statement bounds n<=1e5, m<=2e5 unchanged.
