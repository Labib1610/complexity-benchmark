family: "13"
family_name: partition
criterion: 3
class: INFEASIBLE
problem_letter: C
intended_algorithm: "sum the durations; an odd total cannot be split into two equal whole halves, so print NO"
reduction_note: "odd total sum makes equal partition impossible; no subset can sum to a non-integer"
constraint_delta: "guarantee total sum is odd; output the sum as proof of infeasibility"
judge: exact
time_limit_s: 1
memory_limit_mb: 256
scaling:
  # Corrected (file 26/38) rule. Odd total -> no equal split (two equal whole halves sum to an
  # even number); the reference sums and checks parity in O(n). The baseline
  # (tools/naive_family_13_criterion_3.py) searches subsets for an equal split (2*sum == total);
  # with an odd total that is impossible, so it explores the whole 2^n tree -> TLEs.
  model_time_limit_s: 1
  baseline_probe:
    - {n: 20, baseline_s: 0.13}         # pass
    - {n: 24, baseline_s: 1.95}         # crosses the 1s limit
    - {n: 40, baseline_s: ">4"}
  baseline_tle_from_size: 22
  chosen_max_size: 40                   # 2^n depth-n recursive baseline, kept modest
  ramp_sizes: [20, 24, 30, 36, 40]      # n per case 03-07
  ramp_baseline: [pass, TLE, TLE, TLE, TLE]
  baseline_tle_confirmed: true          # exit=124 at 1s on cases 04,05,06,07
  gen_command: "tools/gen_family_13.py --criterion 3 --n <n> --seed 1"
  reference_gen_seconds: [{case: "07", n: 40, seconds: 0.01}]
  notes: >-
    O(n) parity check vs a 2^n subset search. As with every INFEASIBLE arm the answer is a
    constant (NO), so print("NO") passes by design -- the tier shows the search route TLEs.
    Sizes kept <=40 (the 2^n search is depth-n recursive); statement bound n<=2e5 unchanged.
