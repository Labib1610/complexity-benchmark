family: "13"
family_name: partition
criterion: 1
class: NPC
problem_letter: A
intended_algorithm: "if total is odd print NO; else meet-in-the-middle to find a subset summing to total/2 (enumerate half-subset sums, hash one half, match complements)"
reduction_note: "PARTITION; NP-complete; special case of SUBSET SUM with target = total/2"
constraint_delta: "anchor variant with large values (up to 10^9); pseudo-poly DP ruled out"
judge: custom
time_limit_s: 5
memory_limit_mb: 256
scaling:
  # REBUILT per audit B2/B3/B6, mirroring the family_04 template. Reference is meet-in-the-middle
  # O(2^(n/2)) for a subset summing to total/2, vs a naive 2^n include/exclude search
  # (tools/naive_family_13_criterion_1.py). Large values (up to 1e9) rule out the pseudo-poly DP.
  model_time_limit_s: 5
  #
  # AUDIT FIX (B2/B3): the old hard-NO instances were "all-even durations, total = 2 (mod 4)", a
  # PARITY/GCD-TRIVIAL NO (divide out gcd=2 -> odd total -> NO instantly, no search). Hard-NO
  # instances are now GENUINE: random COPRIME durations, EVEN total (so the odd-total refutation
  # does not apply), no single element exceeding half, and no subset summing to total/2 (verified
  # by MITM). Constructible only for n<=~32 (subset sums grow dense); above that the ramp uses
  # HARD-YES planted balanced splits that the naive search TLEs finding while MITM solves instantly.
  #
  # MEMORY CEILING (measured): the MITM reference hashes 2^(n/2) (sum,mask) pairs.
  # n=38 -> ~148MB (fits 256), n=40 -> ~296MB (exceeds). Ramp tops at n=38; statement n<=40 kept.
  chosen_max_size: 38
  ramp_sizes: [26, 30, 32, 36, 38]       # cases 06-10
  ramp_kind:  [no, yes, no, yes, yes]    # genuine NO up to 32; hard-YES witness at 36,38
  ramp_verdicts: [NO, YES, NO, YES, YES]
  ramp_baseline: [TLE, TLE, TLE, TLE, TLE]
  baseline_tle_confirmed: true
  gen_command: "tools/gen_family_13.py --criterion 1 --n <n> --seed <s> --kind <yes|no|rand>"
  honest_limitation: >-
    Inherent gradeable-NPC ceiling (see family_04 REBUILD_NOTES): a case must be solvable by the
    reference to have an answer key, so it can never be hard for an equally good solver. A model
    that writes meet-in-the-middle solves every case here in <0.5 s. The tier separates naive
    O(2^n) search (and pseudo-poly DP) from MITM -- not hardness against a competent exact solver.
  notes: >-
    2^(n/2) MITM vs 2^n search. Hard-YES cases plant a balanced split found late by the naive;
    hard-NO cases are now genuine (coprime, even total, MITM-verified unsplittable), removing the
    old parity/gcd shortcut. Statement n<=40 kept; ramp caps at n=38 (MITM ~148MB; ~296MB at n=40).
