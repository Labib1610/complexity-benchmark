family: "13"
family_name: partition
criterion: 1
class: NPC
problem_letter: A
intended_algorithm: "if total is odd print NO; else meet-in-the-middle to find a subset summing to total/2 (enumerate half-subset sums, hash one half, match complements)"
reduction_note: "PARTITION; NP-complete; special case of SUBSET SUM with target = total/2"
constraint_delta: "anchor variant with large values (up to 10^9); pseudo-poly DP ruled out"
judge: custom
time_limit_s: 5
memory_limit_mb: 256
scaling:
  # Corrected (file 26/38) rule. Mirrors families 04/12: meet-in-the-middle O(2^(n/2)) for a
  # subset summing to total/2, vs a naive 2^n include/exclude search
  # (tools/naive_family_13_criterion_1.py). Large values (up to 1e9) rule out the pseudo-poly DP.
  # HARD NO cases are EVEN-SUM-BUT-UNSPLITTABLE (not random): all durations even and total forced
  # to 2 (mod 4) so target = total/2 is ODD, unreachable by any even subset sum -> exhaustive
  # refutation. HARD YES cases plant one balanced split (unique-ish) that the naive finds late.
  model_time_limit_s: 5
  baseline_probe:                       # 2^n search vs MITM reference
    - {n: 24, splittable: false, baseline_s: 1.35, reference_s: 0.01}   # last under 5s (NO, parity)
    - {n: 26, splittable: false, baseline_s: 5.38, reference_s: 0.02}   # crosses the limit
    - {n: 30, splittable: true,  baseline_s: ">8", reference_s: 0.02}   # HARD YES also blows up
    - {n: 34, splittable: false, baseline_s: ">8", reference_s: 0.07}
  baseline_tle_from_size: 26
  # MEMORY CEILING: the MITM reference hashes 2^(n/2) half-subset (sum,mask) pairs. Measured:
  # n=34 -> 43MB, n=36 -> 80MB, n=38 -> 148MB, n=40 -> ~296MB (over 256). Ramp tops at n=38.
  chosen_max_size: 38                   # reference ~0.26s / 148MB at n=38
  ramp_sizes: [20, 24, 28, 32, 38]      # n per case 06-10
  ramp_specs:
    - {case: "06", n: 20, splittable: true,  verdict: YES}
    - {case: "07", n: 24, splittable: false, verdict: NO}
    - {case: "08", n: 28, splittable: false, verdict: NO}
    - {case: "09", n: 32, splittable: true,  verdict: YES}   # HARD YES
    - {case: "10", n: 38, splittable: false, verdict: NO}
  ramp_verdicts: [YES, NO, NO, YES, NO]
  ramp_baseline: [pass, pass, TLE, TLE, TLE]
  baseline_tle_confirmed: true          # exit=124 at 5s on cases 08,09,10
  hard_no_is_even_sum_unsplittable: true   # CONFIRMED: all-even values, total = 2 (mod 4) -> odd target
  gen_command: "tools/gen_family_13.py --criterion 1 --n <n> --seed 1 --splittable <yes|no>"
  reference_gen_seconds: [{case: "10", n: 38, seconds: 0.26}]
  notes: >-
    2^(n/2) MITM vs 2^n search. The HARD NO cases (07,08,10) are EVEN-SUM-BUT-UNSPLITTABLE by a
    parity argument (all durations even, total = 2 mod 4, so target = total/2 is odd and no even
    subset sum reaches it) -- NOT random even-sum instances (which are usually satisfiable/easy).
    Case 09 is a HARD YES (planted balanced split, found late by the naive), so the tier is
    non-gameable even vs a timeout-fallback-to-NO. Statement n<=40 kept; ramp caps at n=38 (MITM
    memory ~148MB there, ~296MB by n=40).
