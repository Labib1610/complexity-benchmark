family: "13"
family_name: partition
criterion: 2
class: P
problem_letter: B
intended_algorithm: "if total is odd print NO; else boolean subset-sum DP to total/2 with predecessor tracking to reconstruct one group; O(n*S)"
reduction_note: "partition with small integers is pseudo-polynomial DP; polynomial given bounded value range"
constraint_delta: "values bounded by n; total sum <=n^2; DP runtime is polynomial in input size"
judge: custom
time_limit_s: 2
memory_limit_mb: 256
scaling:
  # REBUILT per audit B2/B6/gate-12, mirroring the family_04 template. Small durations (<=100) so a
  # subset-sum DP to total/2 is polynomial O(n*S). Same task/schema as criterion 1; the one
  # documented switch is value magnitude.
  model_time_limit_s: 2
  #
  # AUDIT FIX (gate 12 -- P tier must pass with margin): the old reference was a boolean-LIST DP
  # that took ~2.1s at n=2000, ABOVE the 2s limit (audit V5 flagged partition B as missing 2s). The
  # reference is now an efficient BITSET DP (dp |= dp << c), ~0.1s at n=2000 -- a >10x margin.
  # AUDIT FIX (B2/B6): the old NO instances used "all-even + total = 2 (mod 4)" (parity-trivial).
  # NO instances are now GENUINE (coprime, even total, DP-verified unsplittable); genuine small-
  # value NO exists only at small n, so NO cases sit at n<=12 and large n (to 2000) demonstrates the
  # polynomial DP via YES cases. Distinct seeds per case (no dupes).
  chosen_max_size: 2000
  ramp_sizes: [8, 10, 12, 50, 100, 300, 600, 1000, 1500, 2000]  # cases 01-10
  ramp_kind:  [no, no, no, yes, yes, yes, yes, yes, yes, yes]
  ramp_verdicts: [NO, NO, NO, YES, YES, YES, YES, YES, YES, YES]
  gen_command: "tools/gen_family_13.py --criterion 2 --n <n> --seed <s> --kind <yes|no>"
  p_timing_margin: "bitset-DP reference runs in ~0.1s at n=2000 vs the 2s limit -- a >10x margin (gate 12)"
  notes: >-
    O(n*S) bitset DP vs 2^n search; the discriminator is exponential-vs-polynomial. NO cases are now
    genuine (coprime, even total, DP-verified), removing the old parity shortcut, and the reference
    passes with a comfortable margin. Statement bounds n<=2000, values<=100 unchanged.
