family: "14"
family_name: steiner_tree
criterion: 3
class: INFEASIBLE
problem_letter: C
intended_algorithm: "compute site degrees; print the smallest required site with degree 0 (no cabling option can connect it)"
reduction_note: "isolated required terminal cannot be reached by any spanning subtree; immediate certificate"
constraint_delta: "guarantee one required terminal is isolated; output the node id"
judge: exact
time_limit_s: 1
memory_limit_mb: 256
scaling:
  # Corrected (file 26/39) rule. One required site has degree 0 (no cabling option touches it), so
  # the terminals can never all be connected; the reference scans degrees in O(n+m) and prints the
  # smallest such required id. The baseline (tools/naive_family_14_criterion_3.py) does NOT scan
  # and instead tries to actually connect the terminals -- the same 2^(n-t) relay-subset Steiner
  # attempt as criterion 1 -- which never succeeds (a terminal is isolated), so it TLEs.
  model_time_limit_s: 1
  baseline_probe:                       # Steiner-attempt baseline, isolated terminal at high id
    - {n: 20, t: 5, optional: 15, baseline_s: 0.15}   # pass
    - {n: 26, t: 5, optional: 21, baseline_s: ">4"}   # TLE
    - {n: 40, t: 5, optional: 35, baseline_s: ">4"}
  baseline_tle_from_size: 24            # n (optional ~ 19 at t=5)
  chosen_max_size: 40                   # baseline is 2^(n-t), kept modest
  ramp_sizes: [20, 26, 30, 34, 40]      # n per case 03-07
  ramp_specs:
    - {case: "03", n: 20, t: 5}
    - {case: "04", n: 26, t: 5}
    - {case: "05", n: 30, t: 5}
    - {case: "06", n: 34, t: 5}
    - {case: "07", n: 40, t: 5}
  ramp_answers: [20, 26, 30, 34, 40]    # isolated required site at the HIGH id (all differ)
  ramp_baseline: [pass, TLE, TLE, TLE, TLE]
  baseline_tle_confirmed: true          # exit=124 at 1s on cases 04,05,06,07
  gen_command: "tools/gen_family_14.py --criterion 3 --n <n> --m 2n --t 5 --seed 1 --at high"
  reference_gen_seconds: [{case: "07", n: 40, seconds: 0.01}]
  notes: >-
    O(n+m) degree scan vs an exponential 2^(n-t) Steiner attempt. The isolated required site is at
    the HIGH id (a scan-from-1 must reach it); answers differ across cases so no constant passes.
    The baseline TLEs from optional ~18; sizes kept modest (2^(n-t)). Statement bounds n<=2e5,
    m<=2e5 unchanged.
