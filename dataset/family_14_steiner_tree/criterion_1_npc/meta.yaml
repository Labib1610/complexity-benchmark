family: "14"
family_name: steiner_tree
criterion: 1
class: NPC
problem_letter: A
intended_algorithm: "Dreyfus-Wagner / Erickson bitmask DP dp[mask][v]=min subtree connecting terminals in mask containing v; subset-merge step plus Dijkstra edge relaxation per mask; O(3^t*n + 2^t*(n+m)log n)"
reduction_note: "STEINER TREE; NP-complete; reduction from EXACT COVER"
constraint_delta: "anchor variant with k>=3 required terminals (NP-complete base)"
judge: exact
time_limit_s: 5
memory_limit_mb: 256
scaling:
  # Corrected (file 26/39) rule. The window is the TERMINAL/NODE ASYMMETRY (like family 11):
  # the Dreyfus-Wagner reference is exponential in t (terminals, kept <=10 -> 3^10 ~ 59K), while
  # the realistic baseline (tools/naive_family_14_criterion_1.py) enumerates subsets of the
  # OPTIONAL relay sites -- 2^(n-t) -- building an induced-subgraph MST per subset (exact, matches
  # the reference). HOLD t SMALL AND GROW n: optional = n-t grows and kills the baseline; the 3^t
  # reference is unaffected. This is an OPTIMISATION (report the min cost), so no YES/NO to game.
  model_time_limit_s: 5
  baseline_probe:                       # hold t, grow optional = n-t; baseline vs DW reference
    - {n: 24, t: 8,  optional: 16, baseline_s: 1.37, reference_s: 0.02}   # last under 5s
    - {n: 26, t: 8,  optional: 18, baseline_s: 6.0,  reference_s: 0.02}   # crosses the limit
    - {n: 30, t: 10, optional: 20, baseline_s: ">8", reference_s: 0.16}
    - {n: 34, t: 8,  optional: 26, baseline_s: ">8", reference_s: 0.03}
  baseline_tle_from_size: 26            # n (with t=8 -> optional 18)
  chosen_max_size: 34                   # n; reference (3^t*n) stays instant, baseline decisively dead
  ramp_sizes: [20, 24, 26, 30, 34]      # n per case 06-10
  ramp_specs:
    - {case: "06", n: 20, t: 8}
    - {case: "07", n: 24, t: 8}
    - {case: "08", n: 26, t: 8}
    - {case: "09", n: 30, t: 10}
    - {case: "10", n: 34, t: 8}
  ramp_baseline: [pass, pass, TLE, TLE, TLE]
  baseline_tle_confirmed: true          # exit=124 at 5s on cases 08,09,10
  gen_command: "tools/gen_family_14.py --criterion 1 --n <n> --t <t> --seed 1"
  reference_gen_seconds: [{case: "10", n: 34, seconds: 0.03}]
  notes: >-
    The window is FIXING t WHILE GROWING n: 3^t Dreyfus-Wagner reference vs a 2^(n-t) relay-subset
    baseline. Relays genuinely help (answers ~270-340 vs a terminal-only MST ~6000), so it is a
    real Steiner instance. Optimisation output (min cost), so non-gameable. Statement bounds n<=100,
    t<=10 kept (the baseline dies by n~26 at t=8; the reference is tractable far past the ramp).
