family: "03"
family_name: hamiltonian_path
criterion: 2
class: P
problem_letter: B
intended_algorithm: "Kahn's algorithm; at each step the in-degree-0 set must have size exactly 1; if not, output NO; then verify consecutive pairs in the forced order are connected; O(n+m)"
reduction_note: "unique topological order in a DAG implies a Hamiltonian path exists; O(n+m)"
constraint_delta: "graph is a DAG with unique topological order; polynomial via topo-sort"
judge: custom
time_limit_s: 1
memory_limit_mb: 256
# audit B4: any-route output (no lex-min canonicalization); custom judge accepts any valid route.
complexity_switch: "the road network is one-way and acyclic (a DAG), so a Hamiltonian path is the unique topological order and is found in linear time; output ANY valid route"
scaling:
  # Corrected (file 26/28) rule. Real asymptotic gap: reference is Kahn's algorithm
  # O(n+m); the realistic baseline (tools/naive_family_03_criterion_2.py) is the same
  # unique-topological-order logic but RESCANS all n vertices each step for the
  # in-degree-0 set, O(n^2). Both output the identical order.
  model_time_limit_s: 1
  baseline_probe:                       # O(n^2) baseline on a unique-order (YES) instance
    - {size: 2000,  baseline_s: 0.08}
    - {size: 4000,  baseline_s: 0.3}
    - {size: 8000,  baseline_s: 1.16}   # crosses 1s
    - {size: 20000, baseline_s: ">15"}
  baseline_tle_from_size: 8000
  chosen_max_size: 200000               # reference (Kahn) ~0.35s at n=2e5, comfortable
  ramp_sizes: [1000, 2000, 20000, 100000, 200000]   # cases 05-09
  ramp_seeds: [1, 1, 1, 1, 1]
  ramp_unique: [yes, no, yes, yes, yes] # NO = two simultaneous in-degree-0 vertices
  ramp_verdicts: [YES, NO, YES, YES, YES]
  ramp_baseline: [pass, pass, TLE, TLE, TLE]
  baseline_tle_confirmed: true          # exit=124 at 1s on cases 07,08,09
  gen_command: "tools/gen_family_03.py --criterion 2 --n <n> --seed 1 --unique <yes|no>"
  # The large TLE cases are YES on purpose: a YES requires producing the exact forced
  # order (judge=exact), which forces the O(n^2) baseline through all n steps and
  # cannot be produced by a constant. m capped at the statement bound 2e5.
  reference_gen_seconds:
    - {case: "05", size: 1000,   seconds: 0.0}
    - {case: "06", size: 2000,   seconds: 0.0}
    - {case: "07", size: 20000,  seconds: 0.05}
    - {case: "08", size: 100000, seconds: 0.28}
    - {case: "09", size: 200000, seconds: 0.35}
  notes: >-
    Inefficient-but-correct O(n^2) topological sort TLEs at n>=20000 while the O(n+m)
    Kahn reference is comfortable to n=2e5. Statement bound already n<=2e5 (unchanged);
    edges capped at m<=2e5. NO instances (two sources) are cheap to detect, so the
    discriminating TLE cases are large YES instances that force the full forced order.
