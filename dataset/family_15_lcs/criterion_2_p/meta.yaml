family: "15"
family_name: lcs
criterion: 2
class: P
problem_letter: B
intended_algorithm: "standard 2D suffix DP dp[i][j]=LCS of s[i:],t[j:]; reconstruct the lexicographically smallest LCS by greedily picking the smallest next letter that stays on an optimal path (next-position tables); O(n*m)"
reduction_note: "2-sequence LCS is solvable in O(n*m) via standard DP; no hardness"
constraint_delta: "exactly 2 sequences; polynomial 2D DP applies"
judge: exact
time_limit_s: 2
memory_limit_mb: 256
scaling:
  # Corrected (file 26/40) rule. Huge gap: the reference is the standard O(L^2) 2-D suffix DP;
  # the baseline (tools/naive_family_15_criterion_2.py) is a memo-less recursive LCS, O(2^L),
  # dead by L~25 on dissimilar strings. (Identical strings have no branching, so the naive runs
  # in O(L) -- those are the pass cases; dissimilar strings force the 2^L blow-up.)
  model_time_limit_s: 2
  baseline_probe:
    - {L: 100,  mode: identical, baseline_s: 0.01}   # pass (no branching)
    - {L: 2000, mode: identical, baseline_s: 1.61}   # pass
    - {L: 100,  mode: random,    baseline_s: ">4"}   # TLE (2^L branching)
    - {L: 500,  mode: low,       baseline_s: ">4"}
  baseline_tle_from_size: 25            # L (dissimilar strings)
  chosen_max_size: 2000
  ramp_sizes: [100, 2000, 100, 500, 1000]   # L per case 06-10
  ramp_specs:
    - {case: "06", L: 100,  mode: identical}   # LCS = whole (pass)
    - {case: "07", L: 2000, mode: identical}   # LCS = whole (pass)
    - {case: "08", L: 100,  mode: random}
    - {case: "09", L: 500,  mode: low}         # LCS = 1 (disjoint-ish)
    - {case: "10", L: 1000, mode: random}
  ramp_baseline: [pass, pass, TLE, TLE, TLE]
  baseline_tle_confirmed: true          # exit=124 at 2s on cases 08,09,10
  gen_command: "tools/gen_family_15.py --criterion 2 --L <L> --seed 1 --mode <identical|low|random>"
  reference_gen_seconds: [{case: "07", L: 2000, seconds: 0.32}]
  # POOR-CONSTANTS CHECK: the reference's O(L^2) nested-list DP is COMFORTABLE at L=2000 (0.32s,
  # well under the 2s limit) -- no strain. Includes identical strings (LCS = whole) and a
  # disjoint-ish 'low' case (LCS = 1) per file 40.
  notes: >-
    O(L^2) DP vs 2^L recursion. Identical strings (06,07) have no branching so the naive passes;
    dissimilar strings (08,09,10) blow up. The reference is comfortable at L=2000 (0.32s), no
    poor-constants strain. Statement bound L<=2000 unchanged.
