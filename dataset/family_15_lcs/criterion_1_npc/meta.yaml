family: "15"
family_name: lcs
criterion: 1
class: NPC
problem_letter: A
intended_algorithm: "k-dimensional DP dp[pos]=longest shared subsequence of the k suffixes; take the letter when all k current letters match else advance one sequence; reconstruct one witness; O(L^k)"
reduction_note: "MULTIPLE-SEQUENCE LCS for k>=3 sequences; NP-complete; reduction from VERTEX COVER"
constraint_delta: "anchor variant with k>=3 sequences; NP-complete"
judge: custom
time_limit_s: 5
memory_limit_mb: 256
scaling:
  # Corrected (file 26/40) rule. The reference is itself exponential in k (a k-dimensional
  # memoized DP, O(L^k)); the baseline (tools/naive_family_15_criterion_1.py) is the SAME LCS
  # recursion WITHOUT memoization (~k^L). HOLD k SMALL AND GROW L moderately: the memo-less
  # recursion over a SMALL alphabet ({a,b,c}) branches maximally and TLEs at L~7, while the
  # L^k DP is merely slow (fine offline). This is an OPTIMISATION (report length + a witness
  # motif), so it is non-gameable. NOTE the reference cost grows as L^k, so sizes are kept
  # where the reference still finishes UNDER the 5s limit (so a correct k-D DP student passes):
  # k=5 L=16 -> ~2.5s; beyond that even the reference exceeds 5s (k=5 L=20 -> ~10s offline).
  model_time_limit_s: 5
  baseline_probe:                       # memo-less recursion vs L^k DP, alphabet abc
    - {k: 3, L: 6,  baseline_s: 1.94, reference_s: 0.01}   # last under 5s
    - {k: 3, L: 7,  baseline_s: ">7", reference_s: 0.01}   # crosses the limit
    - {k: 4, L: 14, baseline_s: ">7", reference_s: 0.06}
    - {k: 5, L: 16, baseline_s: ">7", reference_s: 2.54}
  baseline_tle_from_size: 7             # L (small alphabet)
  chosen_max_size: 16                   # L at k=5 (reference ~2.5s, still under 5s)
  ramp_sizes: [6, 10, 14, 12, 16]       # L per case 06-10
  ramp_specs:
    - {case: "06", k: 3, L: 6}
    - {case: "07", k: 3, L: 10}
    - {case: "08", k: 4, L: 14}
    - {case: "09", k: 5, L: 12}
    - {case: "10", k: 5, L: 16}
  ramp_baseline: [pass, TLE, TLE, TLE, TLE]
  baseline_tle_confirmed: true          # exit=124 at 5s on cases 07,08,09,10
  runaway_killed_cleanly: true          # timeout 5 on k=5 L=20 -> exit=124 in 5.0s (no hang)
  gen_command: "tools/gen_family_15.py --criterion 1 --k <k> --L <L> --seed 1 --alphabet abc"
  reference_gen_seconds: [{case: "10", k: 5, L: 16, seconds: 2.54}]
  notes: >-
    Memoized L^k DP vs memo-less k^L recursion; the window is FIXING k WHILE GROWING L. Small
    alphabet {a,b,c} makes the naive recursion explode by L~7. Sizes kept where the reference
    still runs under 5s (k=5 L=16 ~2.5s). Optimisation output, so non-gameable. Statement bounds
    k<=5, L<=20 kept. RUNAWAY CONFIRMED KILLED: the runner uses subprocess.run(timeout=time_limit_s)
    with TimeoutExpired handling; a runaway naive on k=5 L=20 is killed cleanly at 5s (exit 124),
    fixing the earlier 20-minute hang.
